  host.innerHTML=`<svg class="qz" viewBox="0 0 400 400" role="img" aria-label="Quintenzirkel"></svg><p class="small" style="text-align:center" id="qz-t"></p><div class="btnrow" style="justify-content:center" id="qz-l"></div>`;
  const svg=$('svg',host), cx=200, cy=200, R1=165, R2=108;
  function draw(){
    const roles={}; roles[sel]='rt'; roles[(sel+11)%12]='rs'; roles[(sel+1)%12]='rd';
    const rolesM={}; rolesM[sel]='rt'; rolesM[(sel+11)%12]='rs'; rolesM[(sel+1)%12]='rd';
    let s=`<circle class="ring" cx="${cx}" cy="${cy}" r="${R1}"/><circle class="ring" cx="${cx}" cy="${cy}" r="${R2}"/>`;
    OUT.forEach((n,i)=>{const a=(i*30-90)*Math.PI/180,x=cx+R1*Math.cos(a),y=cy+R1*Math.sin(a), cl=roles[i]?'m '+roles[i]:'';
      s+=`<g class="qn ${cl}" data-i="${i}" tabindex="0" role="button" aria-label="${n}-Dur"><circle cx="${x}" cy="${y}" r="${n.length>3?27:22}"/><text class="n" x="${x}" y="${y+4}">${n.replace(' / ','/')}</text></g>`;});
    INN.forEach((n,i)=>{const a=(i*30-90)*Math.PI/180,x=cx+R2*Math.cos(a),y=cy+R2*Math.sin(a), cl=rolesM[i]?'m '+rolesM[i]:'';
      s+=`<g class="qn ${cl}" data-i="${i}" data-m="1" tabindex="0" role="button" aria-label="${n}-Moll"><circle cx="${x}" cy="${y}" r="${n.length>3?22:17}"/><text class="r" x="${x}" y="${y+4}">${n.replace(' / ','/')}</text></g>`;});
    const v=VZN[sel], vt=v===0?'keine Vorzeichen':v>0?v+(v===1?' Kreuz':' Kreuze'):(-v)+' ♭';
    s+=`<text class="ct" x="${cx}" y="${cy-4}">${OUT[sel].split(' / ')[0]}-Dur</text><text class="ct2" x="${cx}" y="${cy+16}">${sel===6?'6 ♯ oder 6 ♭':vt}</text>`;
    svg.innerHTML=s;
    const ch=keyChords(OUTK[sel],'dur'), nm=OUT[sel].split(' / ')[0];
    const f=(l,i)=>`${l}: <strong>${chName(ch[i])}</strong>`;
    $('#qz-t',host).innerHTML=`In ${nm}-Dur: ${f('T',0)} (blau), ${f('S',3)} (gelb), ${f('D',4)} (grün). Innen: ${f('Tp',5)}, ${f('Sp',1)}, ${f('Dp',2)}.`;
    const lb=$('#qz-l',host); lb.innerHTML='';
    [['T',0],['S',3],['D',4],['Tp',5],['Sp',1],['Dp',2]].forEach(([l,i])=>{lb.appendChild(el(`<button class="chip" type="button">${l} ${chName(ch[i])}</button>`)).onclick=()=>sndChord(ch[i].notes);});
    const kp=el(`<button class="btn primary sm" type="button">${ICON_PLAY}Kadenz</button>`); kp.onclick=()=>Snd.cadence([0,3,4,0].map(i=>ch[i])); lb.appendChild(kp);
  }
  const hit=e=>{const g=e.target.closest('.qn');if(!g||g.dataset.m)return;sel=+g.dataset.i;draw();};
  svg.addEventListener('click',e=>{const g=e.target.closest('.qn');if(!g)return;sel=+g.dataset.i;draw();});
  svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.qn');if(g){e.preventDefault();sel=+g.dataset.i;draw();}}});
  draw();
}

/* ===== App: Navigation, Seiten, Quiz, Tutor, Glossar ===== */
const root=document.getElementById('app');
let ROUTE='start', TUTOR_PRESET=null;
const exCount=sec=>EX[sec].length;
const secProgress=sec=>{const d=EX[sec].filter(e=>S.ex[e.id]).length;const q=(S.quiz[sec]||0)>=70?1:0;return (d+q)/(EX[sec].length+1);};
function navHTML(){
  const cur=ROUTE;
  const link=(r,n,t,extra)=>`<a class="nl" href="#${r}" ${cur===r?'aria-current="page"':''}><span class="nn">${n}</span><span class="nt">${t}</span>${extra||''}</a>`;
  return SEC_ORDER.map(s=>link(s,SEC_META[s].n,SEC_META[s].t,`<span class="nb"><i style="width:${Math.round(secProgress(s)*100)}%"></i></span>`)).join('')
    +'<span class="nsep"></span>'+link('glossar','Aa','Glossar')+link('tutor','?','Tutor')+link('klausur','K','Klausurtraining');
}
function refreshNav(){const n=$('.side');if(n)n.innerHTML=navHTML();const st=$('#start-areas');if(st)renderAreas(st);}
function shell(){
  root.innerHTML=`<header class="top"><div class="wrap topin"><a class="brand" href="#start"><svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--accent)"/><g stroke="var(--accent-ink)" stroke-width="1.4"><line x1="5" x2="25" y1="9" y2="9"/><line x1="5" x2="25" y1="13" y2="13"/><line x1="5" x2="25" y1="17" y2="17"/><line x1="5" x2="25" y1="21" y2="21"/></g><g fill="var(--accent-ink)"><ellipse cx="10" cy="19" rx="3" ry="2.1"/><ellipse cx="15" cy="15" rx="3" ry="2.1"/><ellipse cx="20" cy="11" rx="3" ry="2.1"/></g></svg>Harmonielehre-Trainer</a><span class="grow"></span><button type="button" class="tbtn" id="snd" aria-pressed="${S.mute?'false':'true'}">${S.mute?'Ton aus':'Ton an'}</button><button type="button" class="tbtn" id="theme">Darstellung</button></div></header><div class="wrap shell"><nav class="side" aria-label="Lernbereiche"></nav><main id="main" tabindex="-1"></main></div>`;
  $('#snd').onclick=e=>{const on=Snd.toggle();e.target.textContent=on?'Ton an':'Ton aus';e.target.setAttribute('aria-pressed',on);if(on)Snd.mel([69],.5);};
  $('#theme').onclick=()=>{const r=document.documentElement,cur=r.getAttribute('data-theme'),dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');};
}
function renderAreas(h){
  h.innerHTML=SEC_ORDER.map(s=>`<a class="area" href="#${s}"><div class="an">${SEC_META[s].n}</div><h3>${SEC_META[s].t}</h3><p>${SEC_META[s].sub}</p><p class="small" style="margin-top:6px">${EX[s].length} Übungen · Quiz · ${SEC_META[s].time}</p><div class="nb"><i style="width:${Math.round(secProgress(s)*100)}%"></i></div></a>`).join('');
}
function pageStart(m){
  const total=SEC_ORDER.reduce((a,s)=>a+secProgress(s),0)/6;
  m.innerHTML=`<section class="hero"><div><h1>Harmonielehre für die Klausur</h1><p class="lead">Intervalle, Dreiklänge, Umkehrungen, Vierklänge, Akkordsymbole und Kadenzen nach dem Skript MU11 (J. Giebel). Jeder Bereich hat einen Lernteil, Übungen mit Klang, ein Quiz und eine Tutor-Abfrage.</p>
  <div class="btnrow"><a class="btn primary" href="#m1">Mit M1 beginnen</a><a class="btn" href="#tutor">Tutor starten</a><a class="btn" href="#klausur">Klausurtraining</a></div>
  <p class="small muted">Gesamtfortschritt: ${Math.round(total*100)} %. Dein Fortschritt wird in diesem Browser gespeichert, falls das möglich ist.</p></div>
  <div><h2>Die sechs Lernbereiche</h2><div class="areas" id="start-areas"></div></div>
  <div class="card"><h3 style="margin-top:0">So arbeitest du am besten</h3><p>1. Lies den Lernteil und höre die Beispiele an. 2. Löse die Übungen, bis du mindestens 60 % schaffst, dann gilt sie als erledigt. 3. Mache das Quiz. 4. Lass dich vom Tutor abfragen. 5. Zum Schluss das Klausurtraining mit gemischten Fragen aus allen Bereichen.</p><p class="small muted">Tipp: Alle Aufgaben werden bei jedem Durchgang neu erzeugt, du kannst also beliebig oft üben. Für den Ton muss einmal ein Knopf gedrückt werden, das erlaubt der Browser nicht anders.</p></div>
  <div class="card"><h3 style="margin-top:0">Spickzettel für die Klausur</h3>${cheatSheet()}</div></section>`;
  renderAreas($('#start-areas',m));
}
function cheatSheet(){
  return `<div class="twocol"><div><strong>Intervalle</strong><p class="small">Erst Stufen zählen (Grobbestimmung), dann Halbtonschritte (Feinbestimmung). Rein: r1, r4, r5, r8. Terz, Sexte, Septime: klein oder groß. Umkehrung: Stufen ergeben 9.</p><strong>Dreiklänge</strong><p class="small">Dur 4+3, Moll 3+4, vermindert 3+3, übermäßig 4+4 Halbtonschritte.</p><strong>Umkehrungen</strong><p class="small">1. Umkehrung = Sextakkord (Terz im Bass). 2. Umkehrung = Quartsextakkord (Quinte im Bass). Erst in Terzen ordnen.</p></div>
  <div><strong>Vierklänge</strong><p class="small">6 = große Sexte, 7 = kleine Septime, maj7 = große Septime.</p><strong>Schreibweise</strong><p class="small">dt. H = am. B, dt. B = am. B♭. Moll: dt. Kleinbuchstabe, am. m.</p><strong>Kadenz</strong><p class="small">Dur: I, IV, V Dur · II, III, VI Moll · VII vermindert. Moll: I, IV Moll · III, VI, VII Dur · II vermindert · V meist Dur. Kadenz = T – S – D – T. Nebenfunktionen: Dur eine kleine Terz tiefer, Moll eine kleine Terz höher.</p></div></div>`;
}

/* ----- Lernbereich ----- */
function pageSection(m,sec,tab){
  const meta=SEC_META[sec];
  tab=tab||'lernen';
  m.innerHTML=`<section><div class="sh"><div class="snum">${meta.n}</div><div><h1>${meta.t}</h1><p class="muted" style="margin:4px 0 0">${meta.sub} · ${meta.time}</p></div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="lernen">Lernen</button><button class="tab" role="tab" data-tab="ueben">Übungen <span class="exn">${EX[sec].filter(e=>S.ex[e.id]).length}/${EX[sec].length}</span></button><button class="tab" role="tab" data-tab="quiz">Quiz${S.quiz[sec]!=null?` <span class="exn">${S.quiz[sec]} %</span>`:''}</button><button class="tab" role="tab" data-tab="tutor">Tutor</button></div><div id="tabbody"></div></section>`;
  const tb=$('#tabbody',m);
  function show(t){
    $$('.tab',m).forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
    tb.innerHTML='';
    if(t==='lernen'){const d=el(`<div class="lesson">${LESSON[sec]()}</div>`);tb.appendChild(d);if(LESSON_AFTER[sec])LESSON_AFTER[sec](d);
      tb.appendChild(el(`<div class="btnrow"><button type="button" class="btn primary" data-go="ueben">Weiter zu den Übungen</button></div>`));}
    if(t==='ueben') pageExercises(tb,sec);
    if(t==='quiz') pageQuiz(tb,sec);
    if(t==='tutor'){TUTOR_PRESET=sec;pageTutor(tb,sec,true);}
    $$('[data-go]',tb).forEach(b=>b.onclick=()=>{show(b.dataset.go);window.scrollTo({top:0});});
    try{sessionStorage.setItem('tab-'+sec,t);}catch(e){}
  }
  $$('.tab',m).forEach(b=>b.onclick=()=>show(b.dataset.tab));
  show(tab);
}
function pageExercises(tb,sec){
  tb.innerHTML=`<p class="lead">${EX[sec].length} interaktive Übungen. Öffne eine Übung, bearbeite sie und wiederhole sie bei Bedarf. Die Aufgaben entstehen jedes Mal neu.</p>`;
  EX[sec].forEach((e,i)=>{
    const d=el(`<details class="ex"><summary><span class="exn">${String(i+1)}</span><span>${e.title}</span>${S.ex[e.id]?'<span class="done">erledigt</span>':''}</summary><div class="exbody"><p class="muted small" style="margin-top:0">${e.desc}</p><div class="exhost"></div></div></details>`);
    let mounted=false;
    d.addEventListener('toggle',()=>{if(d.open&&!mounted){mounted=true;e.mount($('.exhost',d));}});
    tb.appendChild(d);
  });
}
function pageQuiz(tb,sec){
  const best=S.quiz[sec];
  tb.innerHTML=`<p class="lead">10 Fragen zu ${SEC_META[sec].n} ${SEC_META[sec].t}: Notenbild, Hören und Wissensfragen. ${best!=null?`Dein bisher bestes Ergebnis: <strong>${best} %</strong>.`:''} Ab 70 % gilt das Quiz als bestanden.</p><div id="qbox" class="card"></div>`;
  const used=new Set();
  mcRounds($('#qbox',tb),{n:10,quizSec:sec,gen:()=>{for(let k=0;k<40;k++){const q=pick(QB[sec])(); if(q&&!used.has(q.q)){used.add(q.q);return q;}} return pick(QB[sec])();}});
}

/* ----- Klausurtraining ----- */
function pageKlausur(m){
  m.innerHTML=`<section><h1>Klausurtraining</h1><p class="lead">24 gemischte Fragen aus allen sechs Bereichen, ohne Hinweise. Vier Fragen pro Bereich, wie in einer Klausur querbeet.</p><div class="card" id="kbox"></div></section>`;
  const order=shuffle(SEC_ORDER.flatMap(s=>[s,s,s,s]));
  mcRounds($('#kbox',m),{n:order.length,gen:i=>pick(QB[order[i]])(),draw:(q,box,ans)=>drawQ(q,box,ans,{noHint:true})});
}

/* ----- Glossar ----- */
function pageGlossar(m){
  m.innerHTML=`<section><h1>Glossar</h1><p class="lead">${GLOSS.length} Begriffe. Die ersten acht stammen aus dem Skript und sind markiert.</p>
  <div class="trow"><input class="inp" id="gq" type="search" placeholder="Begriff suchen" aria-label="Glossar durchsuchen"><button class="btn" id="gfc" type="button">Karteikarten</button></div>
  <div class="chips" id="gf"><button class="chip on" data-s="all" type="button">Alle</button>${SEC_ORDER.map(s=>`<button class="chip" data-s="${s}" type="button">${SEC_META[s].n}</button>`).join('')}</div>
  <div id="gbody"></div></section>`;
  let sec='all',q='';
  const list=()=>GLOSS.filter(g=>(sec==='all'||g[1]===sec)&&(!q||(g[0]+' '+g[2]).toLowerCase().includes(q))).sort((a,b)=>a[0].localeCompare(b[0],'de'));
  function draw(){
    const l=list(); $('#gbody',m).innerHTML=l.length?`<dl class="gl">${l.map(g=>`<dt>${g[0]}${g[3]?'<span class="tag">Skript</span>':''}<span class="tag">${SEC_META[g[1]].n}</span></dt><dd>${g[2]}</dd>`).join('')}</dl>`:'<p class="muted">Kein Begriff gefunden.</p>';
  }
  $('#gq',m).oninput=e=>{q=e.target.value.toLowerCase().trim();draw();};
  $$('#gf .chip',m).forEach(c=>c.onclick=()=>{sec=c.dataset.s;$$('#gf .chip',m).forEach(x=>x.classList.toggle('on',x===c));draw();});
  $('#gfc',m).onclick=()=>flash(m,list());
  draw();
}
function flash(m,l){
  if(!l.length)return; l=shuffle(l); let i=0,flip=false;
  const b=$('#gbody',m);
  const draw=()=>{const g=l[i];b.innerHTML=`<div class="rh"><span>Karte ${i+1} von ${l.length}</span><div class="bar"><i style="width:${i/l.length*100}%"></i></div></div><button type="button" class="fc" id="fcb" aria-label="Karte umdrehen">${flip?`<span>${g[2]}</span>`:`<strong>${g[0]}</strong>`}</button><p class="small muted" style="text-align:center">${flip?'Antwort':'Tippe auf die Karte, um die Erklärung zu sehen.'}</p><div class="btnrow" style="justify-content:center"><button class="btn" id="fcw" type="button">Nochmal üben</button><button class="btn primary" id="fcn" type="button">Gewusst</button><button class="btn ghost" id="fcx" type="button">Zurück zur Liste</button></div>`;
    $('#fcb',b).onclick=()=>{flip=!flip;draw();};
    $('#fcn',b).onclick=()=>{i++;flip=false;if(i>=l.length){b.innerHTML='<div class="result"><div class="big">✓</div><p>Alle Karten durch.</p><button class="btn primary" id="fcr" type="button">Neu mischen</button></div>';$('#fcr',b).onclick=()=>flash(m,l);return;}draw();};
    $('#fcw',b).onclick=()=>{l.push(l[i]);i++;flip=false;draw();};
    $('#fcx',b).onclick=()=>pageGlossar(m.closest('main')||m);
  };draw();
}

/* ----- Tutor ----- */
const TUTOR_IN={m1:'Wir starten bei den Intervallen. Denk daran: erst Stufen zählen, dann Halbtonschritte.',m2:'Dreiklänge: Grundton, Terz, Quinte. Achte auf die untere Terz.',m3:'Umkehrungen: Bring die Töne gedanklich in Terzschichtung.',m4:'Weitere Akkorde: vermindert, übermäßig und die Vierklänge.',m5:'Symbole: Pass bei H und B auf.',m6:'Kadenzen: Stufen, Funktionen und der Quintenzirkel.'};
function pageTutor(m,presetSec,embedded){
  const wrap=embedded?m:(m.innerHTML=`<section><h1>Tutor</h1><p class="lead">Der Tutor fragt dich Bereich für Bereich ab. Er stellt acht Fragen, kommentiert deine Antworten und fragt Fehler am Ende noch einmal in neuer Form ab. Danach bekommst du eine Auswertung mit Lernempfehlung.</p><div id="tbody"></div></section>`,$('#tbody',m));
  const body=embedded?m:$('#tbody',m);
  if(embedded) body.innerHTML=`<p class="lead">Der Tutor fragt dich zu ${SEC_META[presetSec].t} ab, kommentiert deine Antworten und wiederholt Fehler.</p><div id="tbody"></div>`;
  const host=embedded?$('#tbody',body):body;
  function menu(){
    host.innerHTML=`<div class="card"><h3 style="margin-top:0">Was soll der Tutor abfragen?</h3><div class="chips" id="tm">${SEC_ORDER.map(s=>`<button class="chip${presetSec===s?' on':''}" data-s="${s}" type="button">${SEC_META[s].n} ${SEC_META[s].t}</button>`).join('')}<button class="chip${presetSec==='all'?' on':''}" data-s="all" type="button">Alle Bereiche</button></div><div class="btnrow"><button class="btn primary" id="ts" type="button">Abfrage starten</button></div><p class="small muted">Dein Tutor-Ergebnis: ${SEC_ORDER.map(s=>S.tutor[s]!=null?SEC_META[s].n+' '+S.tutor[s]+' %':null).filter(Boolean).join(' · ')||'noch keine Abfrage'}</p></div>`;
    let pick_=presetSec||SEC_ORDER[0];
    $$('#tm .chip',host).forEach(c=>c.onclick=()=>{pick_=c.dataset.s;$$('#tm .chip',host).forEach(x=>x.classList.toggle('on',x===c));});
    $('#ts',host).onclick=()=>run(pick_);
  }
  presetSec=presetSec||SEC_ORDER[0];
  function run(sec){
    const secs=sec==='all'?SEC_ORDER:[sec]; const N=8;
    const plan=shuffle(Array.from({length:N},(_,i)=>{const s=secs[i%secs.length];return {s,f:QB[s][R(QB[s].length)]};}));
    let i=0,score=0,again=[],bySec={},retried=0;
    host.innerHTML=`<div class="rh"><span id="tp"></span><div class="bar"><i id="tb"></i></div><span id="ts2"></span></div><div class="chat" id="chat" aria-live="polite"></div>`;
    const chat=$('#chat',host);
    const say=(h,cls)=>{const b=el(`<div class="msg ${cls||'tutor'}">${cls==='me'?'':'<div class="who">Tutor</div>'}${h}</div>`);chat.appendChild(b);return b;};
    const head=()=>{$('#tp',host).textContent=i<plan.length?`Frage ${Math.min(i+1,plan.length)} von ${plan.length}`:'Auswertung';$('#tb',host).style.width=(i/plan.length*100)+'%';$('#ts2',host).textContent='Richtig: '+score;};
    function ask(){
      head();
      if(i>=plan.length) return finish();
      const t=plan[i], q=t.f();
      const praise=i===0?(sec==='all'?'Los geht es mit gemischten Fragen.':TUTOR_IN[sec]):(t.retry?'Diese Frage hattest du vorhin falsch. Probiere sie in neuer Form.':pick(['Weiter.','Nächste Frage.','Und jetzt diese.','Gut, weiter im Text.']));
      const b=say(`<p style="margin-top:0">${praise}</p><div class="qb"></div>`);
      const box=$('.qb',b);
      drawQ(q,box,(ok,msg)=>{
        bySec[t.s]=bySec[t.s]||{r:0,n:0}; bySec[t.s].n++; if(ok) {score++;bySec[t.s].r++;}
        if(!ok){again.push(t);}
        i++; head();
        const fb=say(`<strong>${ok?pick(['Richtig.','Genau.','Stimmt.']):'Das war nicht richtig.'}</strong> ${msg||''}`);
        if(!ok&&retried<3&&!t.retry){plan.push({s:t.s,f:t.f,retry:true});retried++;}
        const nb=el(`<div class="btnrow"><button type="button" class="btn primary">${i>=plan.length?'Auswertung':'Weiter'}</button></div>`);
        fb.appendChild(nb);$('button',nb).onclick=()=>{nb.remove();ask();};
        try{$('button',nb).focus({preventScroll:true});}catch(e){}
      },{noHint:false});
    }
    function finish(){
      const pct=Math.round(score/plan.length*100);
      if(sec!=='all'){S.tutor[sec]=Math.max(S.tutor[sec]||0,pct);save();}
      const rows=Object.keys(bySec).map(s=>{const p=Math.round(bySec[s].r/bySec[s].n*100);return `<div class="sumrow"><span>${SEC_META[s].n} ${SEC_META[s].t}</span><div class="bar"><i style="width:${p}%;background:${p>=70?'var(--ok)':'var(--warm)'}"></i></div><span>${p} %</span></div>`;}).join('');
      const weak=Object.keys(bySec).filter(s=>bySec[s].r/bySec[s].n<.7);
      const msg=pct>=85?'Das ist klausurreif.':pct>=60?'Solide Basis, ein paar Lücken sind noch da.':'Hier lohnt sich noch einmal der Lernteil.';
      const b=say(`<p style="margin-top:0"><strong>Auswertung: ${score} von ${plan.length} richtig (${pct} %).</strong> ${msg}</p>${rows}${weak.length?`<p>Wiederhole: ${weak.map(s=>`<a href="#${s}">${SEC_META[s].n} ${SEC_META[s].t}</a>`).join(', ')}.</p>`:'<p>Kein Bereich unter 70 %. Weiter mit dem Klausurtraining.</p>'}<div class="btnrow"><button class="btn primary" id="tr" type="button">Noch eine Runde</button><button class="btn" id="tmn" type="button">Anderen Bereich wählen</button></div>`);
      $('#tr',b).onclick=()=>run(sec); $('#tmn',b).onclick=menu;
      refreshNav();
    }
    say(`Hallo. Ich frage dich ${secs.length===1?'zu <strong>'+SEC_META[secs[0]].t+'</strong>':'quer durch alle Bereiche'} ab. Bei Texteingaben bekommst du einen Hinweis, falls die erste Antwort nicht stimmt.`);
    ask();
  }
  if(embedded) run(presetSec); else menu();
}
S.tutor=S.tutor||{};

/* ----- Router ----- */
function route(){
  let r=(location.hash||'#start').slice(1)||'start';
  if(!(SEC_ORDER.includes(r)||['start','glossar','tutor','klausur'].includes(r))) r='start';
  ROUTE=r;
  const nav=$('.side'); nav.innerHTML=navHTML();
  const m=$('#main');
  if(r==='start') pageStart(m); else if(SEC_ORDER.includes(r)) pageSection(m,r,'lernen');
  else if(r==='glossar') pageGlossar(m); else if(r==='tutor') pageTutor(m,TUTOR_PRESET||null); else pageKlausur(m);
  window.scrollTo({top:0});
  document.title='Harmonielehre-Trainer';
}
shell();
window.addEventListener('hashchange',route);
route();

</script>
