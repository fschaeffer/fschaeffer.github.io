<style>
/* Layout: Seitenleiste mit den sechs Lernbereichen links, Arbeitsfläche rechts. Das Notenbild ist das Hauptmotiv, alles andere bleibt ruhig. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --warm:#F2BE5C; --warm-ink:#241A02; --teal:#4FD1C5; --teal-ink:#06201E;
  --ok:#5ED19A; --okbg:#133124; --bad:#FF8E8E; --badbg:#3A1B21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --card:#141C32; --ink:#E7ECF9; --muted:#9AA7C6; --line:#27324F;
  --accent:#86A3FF; --accent-ink:#0C1222; --soft:#1D2848; --soft2:#2A3A6B;
  --warm:#F2BE5C; --warm-ink:#241A02; --teal:#4FD1C5; --teal-ink:#06201E;
  --ok:#5ED19A; --okbg:#133124; --bad:#FF8E8E; --badbg:#3A1B21; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700} h3{font-size:1.12rem;font-weight:700;margin-top:1.6em}
p{margin:.6em 0;max-width:68ch} a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.small{font-size:.88rem}.muted{color:var(--muted)}.grow{flex:1}

.topin{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font:700 1.15rem var(--f-display);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.tbtn{font:600 .85rem var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;min-height:36px}
.tbtn:hover{background:var(--soft)}
/* Navigation */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 56px}
.side{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.nl{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);min-width:0}
.nl .nn{font:700 .95rem var(--f-display);color:var(--accent);grid-row:span 2;min-width:2.4em}
.nl .nt{font-weight:600;font-size:.92rem;white-space:nowrap}
.nl .nb{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.nl .nb i{display:block;height:100%;background:var(--ok);width:0}
.nl[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nl[aria-current="page"] .nn{color:var(--accent-ink)}
.nl[aria-current="page"] .nb{background:rgba(255,255,255,.3)}
.nsep{flex:0 0 auto;align-self:center;width:1px;height:26px;background:var(--line)}
@media (min-width:900px){
  .shell{grid-template-columns:260px minmax(0,1fr);gap:32px}
  .side{flex-direction:column;overflow:visible;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;gap:6px}
  .nl{flex:none}.nl .nt{white-space:normal}.nsep{width:auto;height:1px;margin:4px 0}
}
main{min-width:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card+.card,.card+.sec{margin-top:16px}

.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:4px 12px;font-size:.88rem}

.st-l,.st-b{stroke:var(--ink);stroke-width:1.1}
.clef,.acc{fill:var(--ink)}
.nt ellipse{fill:var(--ink)}.nt .hole{fill:var(--card)}

.lab{font:700 12.5px var(--f-body);fill:var(--ink)}.lab2{font:12px var(--f-body);fill:var(--muted)}
.ghost ellipse{fill:var(--accent);opacity:.35}
.si{cursor:crosshair;border:1px dashed var(--line)}
.si-h{margin-top:6px}
/* Klaviatur */
.pianowrap{overflow-x:auto;margin:10px 0}
svg.pk{display:block;width:100%;height:auto}
.pk .k{cursor:pointer}
.pk .w rect{fill:var(--card);stroke:var(--muted);stroke-width:1}
.pk .w text{font:600 10px var(--f-body);fill:var(--muted);pointer-events:none}

.pk .w.h3 rect{fill:var(--soft2)}.pk .b.h3 rect{fill:var(--accent);opacity:.8}
.pk .w.h1 text{fill:var(--accent-ink)}
/* Aufgaben */
.qtxt{font-size:1.08rem;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;margin:12px 0}
@media (max-width:560px){.opts{grid-template-columns:repeat(min(var(--cols,2),2),minmax(0,1fr))}.opts[style*="--cols:1"]{grid-template-columns:1fr}}
.opt{font:600 .98rem var(--f-body);text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}

.fb{border-radius:10px;padding:10px 14px;margin:10px 0}

.fb .staffwrap{margin-top:8px}
.rh{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.bar{flex:1;min-width:80px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.rn{margin:10px 0}
.result{text-align:center;padding:18px 6px}
.result .big{font:700 3.4rem var(--f-display);color:var(--accent)}.result .big span{font-size:1.5rem;color:var(--muted)}
.result p{margin-inline:auto}
.trow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.inp{font:600 1rem var(--f-body);padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:42px;min-width:0;flex:1 1 180px}
.inp.num{flex:0 0 76px;text-align:center;padding:6px}
.inp.ok{border-color:var(--ok);background:var(--okbg)}.inp.bad{border-color:var(--bad);background:var(--badbg)}
.hint{background:var(--soft);border-radius:8px;padding:6px 10px}
.htgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:6px 18px;margin:12px 0}
.hrow{display:flex;align-items:center;gap:8px}
.hrow label{flex:1;min-width:0}
details.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.ex>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:700;font-family:var(--f-display);font-size:1.05rem}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--muted)}
details.ex[open]>summary::after{content:"–"}
details.ex .exbody{padding:0 16px 18px}
.exn{font:700 .8rem var(--f-mono);color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 7px}
.done{font:700 .75rem var(--f-body);color:var(--ok);background:var(--okbg);border-radius:999px;padding:2px 9px;white-space:nowrap}
/* Tabellen */
.tw{overflow-x:auto;margin:12px 0}
table.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--soft);font-weight:700}
.tbl td.c,.tbl th.c{text-align:center}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:10px 0}
.pair{border:1px solid var(--line);border-radius:8px;padding:5px 6px;text-align:center;background:var(--card)}
.pair b{display:block;font-family:var(--f-display)}.pair span{color:var(--accent);font-weight:700}

/* Start */
.hero{display:grid;gap:18px}
.hero h1{max-width:16ch}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:18px}
.area{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.area:hover{border-color:var(--accent)}
.area .an{font:700 1.9rem/1 var(--f-display);color:var(--accent)}
.area h3{margin:6px 0 4px}.area p{margin:0;color:var(--muted);font-size:.93rem}
.area .nb{height:5px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}.area .nb i{display:block;height:100%;background:var(--ok)}

.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.mc{min-height:64px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:transparent;font:700 1.05rem var(--f-display);cursor:pointer;padding:4px}
.mc.up{background:var(--card);color:var(--ink);border-color:var(--accent)}
.mc.hit{background:var(--okbg);color:var(--ink);border-color:var(--ok);cursor:default}
/* Quintenzirkel */
svg.qz{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.qz .ring{fill:none;stroke:var(--line);stroke-width:1.2}
.qn{cursor:pointer}.qn circle{fill:var(--card);stroke:var(--line);stroke-width:1.6}
.qn:hover circle{stroke:var(--accent)}
.qn text{text-anchor:middle;pointer-events:none}.qn .n{font:700 13px var(--f-body);fill:var(--ink)}.qn .r{font:700 10px var(--f-body);fill:var(--ink)}
.qn.m.rt circle{fill:var(--accent)}.qn.m.rs circle{fill:var(--warm)}.qn.m.rd circle{fill:var(--teal)}
.qn.m.rt text{fill:var(--accent-ink)}.qn.m.rs text{fill:var(--warm-ink)}.qn.m.rd text{fill:var(--teal-ink)}
.qn.p circle{stroke-width:3.2}.qn.p.rt circle{stroke:var(--accent)}.qn.p.rs circle{stroke:var(--warm)}.qn.p.rd circle{stroke:var(--teal)}
.qn.pick circle{stroke:var(--accent);stroke-width:3}
.qz .ct{font:700 22px var(--f-display);fill:var(--ink);text-anchor:middle}.qz .ct2{font:13px var(--f-body);fill:var(--muted);text-anchor:middle}
/* Tutor */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.msg{max-width:min(100%,640px);padding:12px 16px;border-radius:16px;min-width:0}
.msg.tutor{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start;width:100%}
.msg.me{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px;align-self:flex-end}
.msg .who{font:700 .74rem var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:4px}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;margin:8px 0}
.sumrow .bar{height:10px}
/* Glossar */
.gl dt{font:700 1.08rem var(--f-display);margin-top:14px}.gl dd{margin:2px 0 0;max-width:70ch}
.tag{font:700 .7rem var(--f-body);background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.fc{width:100%;min-height:170px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:22px;font-size:1.1rem;cursor:pointer;text-align:center;color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-body)}
.fc strong{font:700 1.6rem var(--f-display)}
.vlist{display:grid;gap:10px}
.vid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink)}
.vid:hover{border-color:var(--accent)}.vid .vi{grid-row:span 2;width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.vid b{font-family:var(--f-display)}.vid span{color:var(--muted);font-size:.9rem}
.lv{margin-top:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
select.inp{flex:1 1 140px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ----- Namen ----- */
const DE_NAT=['C','D','E','F','G','A','H'];
function deRoot(p,minor){
  const i=mod(p.d,7), l=L[i]; let n;
  if(p.a===0) n=DE_NAT[i];
  else if(p.a===1) n=DE_NAT[i]+'is';
  else if(p.a===-1) n=l==='B'?'B':l==='E'?'Es':l==='A'?'As':l+'es';
  else n='?';
  if(n.length>1&&n!=='Es'&&n!=='As'&&p.a===-1&&l!=='B') n=n.charAt(0)+n.slice(1).toLowerCase();
  return minor?n.charAt(0).toLowerCase()+n.slice(1):n;
}
function deNote(p){ // mit Oktavzeichen: c', c'', h, Gis ...
  const n=deRoot(p,true), o=octOf(p);
  if(o>=4) return n+"'".repeat(o-3);
  if(o===3) return n;
  return cap(n)+(o<2?','.repeat(2-o):'');
}
const amRoot=p=>L[mod(p.d,7)]+(p.a===1?'♯':p.a===-1?'♭':'');
const noteName=p=>deRoot(p,false); // "Fis", "Es"

/* ----- Intervalle ----- */
const IVN={1:'Prime',2:'Sekunde',3:'Terz',4:'Quarte',5:'Quinte',6:'Sexte',7:'Septime',8:'Oktave',9:'None',10:'Dezime'};

function ivlSemis(q,n){
  const deg=((n-1)%7)+1, base=PCS[deg-1]+12*Math.floor((n-1)/7);
  const perfect=[1,4,5].includes(deg);
  const df=perfect?{r:0,v:-1,'ü':1}:{g:0,k:-1,v:-2,'ü':1};
  return base+df[q];
}
function ivlOf(p1,p2){
  let lo=p1,hi=p2;
  if(p2.d<p1.d||(p2.d===p1.d&&midi(p2)<midi(p1))){lo=p2;hi=p1;}
  const n=hi.d-lo.d+1, s=midi(hi)-midi(lo), deg=((n-1)%7)+1;
  const base=PCS[deg-1]+12*Math.floor((n-1)/7), diff=s-base;
  const perfect=[1,4,5].includes(deg);
  const q=perfect?({'0':'r','-1':'v','1':'ü'})[diff]:({'0':'g','-1':'k','-2':'v','1':'ü'})[diff];
  return {n,s,q:q||null,ab:q?q+n:null,name:q?QN[q]+' '+IVN[n]:null};
}
function addInterval(base,q,n,dir){
  dir=dir||1;
  const d=base.d+dir*(n-1), t=midi(base)+dir*ivlSemis(q,n);
  return P(d,t-nat(d));
}
const IVL_LIST=[['r',1],['k',2],['g',2],['k',3],['g',3],['r',4],['ü',4],['v',5],['r',5],['k',6],['g',6],['k',7],['g',7],['r',8],['k',9],['g',9],['k',10],['g',10]]
  .map(([q,n])=>({q,n,ab:q+n,name:QN[q]+' '+IVN[n],hs:ivlSemis(q,n)}));

  uber:{steps:[0,2,4],semi:[0,4,8],minor:false,de:'',am:'aug',desc:'übermäßig'},
  dur6:{steps:[0,2,4,5],semi:[0,4,7,9],minor:false,de:'6',am:'6',desc:'Dur mit hinzugefügter großer Sexte'},
  moll6:{steps:[0,2,4,5],semi:[0,3,7,9],minor:true,de:'6',am:'m6',desc:'Moll mit hinzugefügter großer Sexte'},
  dur7:{steps:[0,2,4,6],semi:[0,4,7,10],minor:false,de:'7',am:'7',desc:'Dur mit kleiner Septime'},

  mmaj7:{steps:[0,2,4,6],semi:[0,3,7,11],minor:true,de:'maj7',am:'m maj7',desc:'Moll mit großer Septime'}

function buildChord(root,type){
  const t=CT[type];
  return t.steps.map((s,i)=>{const d=root.d+s;return P(d,midi(root)+t.semi[i]-nat(d));});
}
function invert(ch,k){
  const c=ch.slice();
  for(let i=0;i<k;i++){const f=c.shift();c.push(P(f.d+7,f.a));}
  return c;
}
function chordNameDE(root,type){
  if(type==='verm') return deRoot(root,true)+' verm.';
  if(type==='uber') return deRoot(root,false)+' überm.';
  return deRoot(root,CT[type].minor)+CT[type].de;
}
function chordNameAM(root,type){ return amRoot(root)+CT[type].am; }
const rootNameOk=p=>Math.abs(p.a)<=1&&!(L[mod(p.d,7)]==='E'&&p.a===1)&&!(L[mod(p.d,7)]==='B'&&p.a===1)&&!(L[mod(p.d,7)]==='C'&&p.a===-1)&&!(L[mod(p.d,7)]==='F'&&p.a===-1);
function chordOk(root,type){return rootNameOk(root)&&buildChord(root,type).every(p=>Math.abs(p.a)<=1);}
function rndRoot(type,minD,maxD){
  for(let k=0;k<200;k++){
    const r=P(rint(minD==null?0:minD,maxD==null?6:maxD),Math.random()<.35?pick([-1,1]):0);
    if(chordOk(r,type)) return r;
  }
  return P(0,0);
}
const INV_LABEL=['Grundstellung','1. Umkehrung (Sextakkord)','2. Umkehrung (Quartsextakkord)'];
const INV_SHORT=['GS','1. U','2. U'];
function triadType(a,b,c){
  const x=midi(b)-midi(a), y=midi(c)-midi(b);
  if(x===4&&y===3) return 'dur'; if(x===3&&y===4) return 'moll';
  if(x===3&&y===3) return 'verm'; if(x===4&&y===4) return 'uber'; return null;
}

/* ----- Tonleitern, Tonarten, Funktionen ----- */
function scale(tonic,mode){
  const semi=mode==='dur'?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10];
  return semi.map((s,i)=>{const d=tonic.d+i;return P(d,midi(tonic)+s-nat(d));});
}

const FUN={dur:['T','Sp','Dp','S','D','Tp','—'],moll:['t','—','tP','s','D','sP','(D)']};
const FUN_NAME={T:'Tonika',S:'Subdominante',D:'Dominante',Tp:'Tonika-Parallele',Sp:'Subdominant-Parallele',Dp:'Dominant-Parallele',
  t:'Tonika',s:'Subdominante',tP:'Tonika-Parallele',sP:'Subdominant-Parallele','(D)':'Zwischendominante (Dominant-Parallele)','—':'verminderter Dreiklang'};
function keyChords(tonic,mode){
  const sc=scale(tonic,mode);
  const types=mode==='dur'?['dur','moll','moll','dur','dur','moll','verm']:['moll','verm','dur','moll','dur','dur','dur'];
  return sc.map((r0,i)=>{const r=r0.d>=7?P(r0.d-7,r0.a):r0;return {deg:i,root:r,type:types[i],fn:FUN[mode][i],notes:buildChord(r,types[i])};});
}
const keyName=k=>deRoot(k.tonic,k.mode==='moll')+'-'+(k.mode==='moll'?'Moll':'Dur');
const KEYS=[
  [0,0,'dur'],[4,0,'dur'],[1,0,'dur'],[5,0,'dur'],[2,0,'dur'],[3,0,'dur'],[6,-1,'dur'],[2,-1,'dur'],[5,-1,'dur'],
  [5,0,'moll'],[2,0,'moll'],[6,0,'moll'],[1,0,'moll'],[4,0,'moll'],[0,0,'moll'],[3,0,'moll'],[3,1,'moll']
].map(([d,a,m])=>({tonic:P(d,a),mode:m})).filter(k=>keyChords(k.tonic,k.mode).every(c=>c.notes.every(p=>Math.abs(p.a)<=1)));
const KEYS_DUR=KEYS.filter(k=>k.mode==='dur'), KEYS_MOLL=KEYS.filter(k=>k.mode==='moll');

const FN_ORDER={dur:[['T',0],['S',3],['D',4],['Tp',5],['Sp',1],['Dp',2]],moll:[['t',0],['s',3],['D',4],['tP',2],['sP',5],['dP/(D)',6]]};

/* ----- Klang: Stimmführung ----- */
function voice(ms,target){
  let best=null;
  for(let inv=0;inv<ms.length;inv++){
    let c=ms.slice();
    for(let i=0;i<inv;i++){c.push(c.shift()+12);}
    for(const sh of [-24,-12,0,12]){
      const cc=c.map(x=>x+sh), avg=cc.reduce((a,b)=>a+b,0)/cc.length;
      const lo=Math.min(...cc), hi=Math.max(...cc);
      const cost=Math.abs(avg-target)+(lo<52?20:0)+(hi>82?20:0);
      if(!best||cost<best.cost) best={cost,notes:cc};
    }
  }
  return best.notes.sort((a,b)=>a-b);
}
function voiceProg(chs){
  let tgt=64; return chs.map(c=>{const m=voice(c.notes.map(midi),tgt);tgt=m.reduce((a,b)=>a+b,0)/m.length;return m;});
}
const bassOf=m=>40+mod(m-40,12);

/* ----- Ton ----- */
const Snd=(()=>{
  let ctx=null,master=null;
  function init(){
    if(S.mute) return false;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      try{ctx=new AC();}catch(e){return false;}
      master=ctx.createGain(); master.gain.value=.85;
      const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    return true;
  }
  function tone(m,t,dur,vel){
    const f=440*Math.pow(2,(m-69)/12), g=ctx.createGain(); g.connect(master);
    const o1=ctx.createOscillator(), o2=ctx.createOscillator(), g2=ctx.createGain();
    o1.type='triangle'; o2.type='sine'; o1.frequency.value=f; o2.frequency.value=f*2; g2.gain.value=.28;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vel,t+.012);
    g.gain.exponentialRampToValueAtTime(vel*.42,t+.3); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
  }
  function play(ev){
    if(!init()) return;
    const t0=ctx.currentTime+.04;
    ev.forEach(e=>e.n.forEach(m=>tone(m,t0+e.t,e.d||1.3,(e.v||.55)/Math.sqrt(e.n.length))));
  }
  return {
    play,
    mel(ms,step){step=step||.62;play(ms.map((m,i)=>({t:i*step,n:[m],d:1.4})));},
    harm(ms){play([{t:0,n:ms,d:2}]);},
    arp(ms){play(ms.map((m,i)=>({t:i*.16,n:[m],d:2.2})));},
    ivl(p1,p2,mode){
      const a=midi(p1),b=midi(p2);
      if(mode==='harm') play([{t:0,n:[a,b],d:2}]);
      else play([{t:0,n:[a],d:1.2},{t:.7,n:[b],d:1.6}]);
    },
    chord(ms,mode){ if(mode==='arp') this.arp(ms); else this.harm(ms); },
    prog(list,step){step=step||1.05;play(list.map((m,i)=>({t:i*step,n:m,d:1.7})));},
    cadence(chs,step){
      const v=voiceProg(chs);
      play(chs.map((c,i)=>({t:i*(step||1.05),n:[bassOf(midi(c.root))].concat(v[i]),d:1.8})));
    },
    toggle(){S.mute=S.mute?0:1;save();return !S.mute;}
  };
})();
const chordMidi=ch=>ch.map(midi);

/* ----- Notenbild ----- */
function noteSVG(x,y,cls){
  return `<g class="nt ${cls||''}"><ellipse cx="${x}" cy="${y}" rx="6.7" ry="4.6" transform="rotate(-8 ${x} ${y})"/><ellipse class="hole" cx="${x}" cy="${y}" rx="2.5" ry="3.7" transform="rotate(-38 ${x} ${y})"/></g>`;
}
function staffSVG(cfg){
  const cols=cfg.cols||[], colW=cfg.colW||78, clef=cfg.clef!==false, left=clef?46:12;
  const ds=[]; cols.forEach(c=>c.notes.forEach(n=>ds.push(n.p.d)));
  const dLo=cfg.dLo!=null?cfg.dLo:Math.min(0,...ds)-1;
  const dHi=cfg.dHi!=null?cfg.dHi:Math.max(clef?14:12,...ds)+1;
  const top=6, yD=d=>top+(dHi-d)*5;
  const hasSub=cols.some(c=>c.sub), hasLab=cols.some(c=>c.label);
  const labH=hasSub?44:hasLab?26:0;
  const W=left+cols.length*colW+10, H=top+(dHi-dLo)*5+10+labH;
  let s=`<svg class="staff" viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" data-left="${left}" data-colw="${colW}" data-top="${top}" data-dhi="${dHi}" data-dlo="${dLo}" role="img" aria-label="${esc(cfg.aria||'Notenbeispiel')}" style="min-width:${Math.round(W*.8)}px;max-width:${Math.round(W*1.35)}px">`;
  [2,4,6,8,10].forEach(d=>{s+=`<line class="st-l" x1="4" x2="${W-4}" y1="${yD(d)}" y2="${yD(d)}"/>`;});
  if(clef) s+=`<path class="clef" transform="translate(6,${yD(4)+2}) scale(0.0445,-0.0445)" d="${GLYPH.clef}"/>`;
  cols.forEach((c,ci)=>{
    const x0=left+ci*colW, x1=x0+colW;
    s+=`<line class="st-b" x1="${x1}" x2="${x1}" y1="${yD(10)}" y2="${yD(2)}"/>`;
    const seq=c.layout==='seq';
    const ns=seq?c.notes.slice():c.notes.slice().sort((a,b)=>a.p.d-b.p.d||a.p.a-b.p.a), n=ns.length;
    let prevD=null, prevDisp=false;
    ns.forEach((o,k)=>{
      let x;
      if(seq) x=x0+colW*(k+.5)/n;
      else{
        x=x0+colW/2; o._disp=false;
        if(prevD!==null&&o.p.d-prevD<=1&&!prevDisp){x+=12;o._disp=true;}
        prevD=o.p.d; prevDisp=o._disp;
      }
      o._x=x;
    });
    const accs=ns.filter(o=>o.p.a!==0).sort((a,b)=>b.p.d-a.p.d), lastD=[];
    accs.forEach(o=>{let j=0;while(lastD[j]!==undefined&&Math.abs(lastD[j]-o.p.d)<6)j++;lastD[j]=o.p.d;o._slot=j;});
    ns.forEach(o=>{
      const y=yD(o.p.d), x=o._x;
      if(o.p.d<=0) for(let l=0;l>=o.p.d;l-=2) s+=`<line class="st-l" x1="${x-11}" x2="${x+11}" y1="${yD(l)}" y2="${yD(l)}"/>`;
      if(o.p.d>=12) for(let l=12;l<=o.p.d;l+=2) s+=`<line class="st-l" x1="${x-11}" x2="${x+11}" y1="${yD(l)}" y2="${yD(l)}"/>`;
      if(o.p.a!==0){
        const g=o.p.a>0?GLYPH.sharp:GLYPH.flat, ax=x-22-12*o._slot-(o._disp?12:0);
        s+=`<path class="acc ${o.cls||''}" transform="translate(${ax},${y+5.5}) scale(0.0427,-0.0427)" d="${g}"/>`;
      }
      s+=noteSVG(x,y,o.cls);
    });
    if(c.label) s+=`<text class="lab" x="${x0+colW/2}" y="${H-labH+16}" text-anchor="middle">${esc(c.label)}</text>`;
    if(c.sub) s+=`<text class="lab2" x="${x0+colW/2}" y="${H-labH+32}" text-anchor="middle">${esc(c.sub)}</text>`;
  });
  if(cfg.input) s+=`<g class="ghost" visibility="hidden"><ellipse rx="6.7" ry="4.6"/></g>`;
  return s+'</svg>';
}
const staffBox=cfg=>`<div class="staffwrap">${staffSVG(cfg)}</div>`;

/* ----- Klaviatur ----- */
function makePiano(host,o){
  const wm=[]; for(let m=o.from;m<=o.to;m++) if(PCS.includes(mod(m,12))) wm.push(m);
  const KW=36,KH=116,BW=22,BH=72,W=wm.length*KW,H=KH+4;
  const idx={}; wm.forEach((m,i)=>{idx[m]=i;});
  let ws='',bs='';
  for(let m=o.from;m<=o.to;m++){
    const white=PCS.includes(mod(m,12));
    if(white){
      const x=idx[m]*KW, nm=['C','D','E','F','G','A','H'][PCS.indexOf(mod(m,12))];
      const lab=nm==='C'?"c"+"'".repeat(Math.max(0,Math.floor(m/12)-4)):nm.toLowerCase();
      ws+=`<g class="k w" data-m="${m}"><rect x="${x+.5}" y="1" width="${KW-1}" height="${KH}" rx="3"/><text x="${x+KW/2}" y="${KH-8}" text-anchor="middle">${lab}</text></g>`;
    }else{
      const x=idx[m-1]*KW+KW-BW/2;
      bs+=`<g class="k b" data-m="${m}"><rect x="${x}" y="1" width="${BW}" height="${BH}" rx="2.5"/></g>`;
    }
  }
  host.innerHTML=`<div class="pianowrap"><svg class="pk" viewBox="0 0 ${W} ${H}" style="min-width:${Math.round(W*.75)}px;max-width:${W*1.3}px" role="group" aria-label="Klaviatur">${ws}${bs}</svg></div>`;
  const svg=$('svg',host);
  const ctl={
    set(hl){$$('.k',svg).forEach(k=>{k.setAttribute('class','k '+(PCS.includes(mod(+k.dataset.m,12))?'w':'b')+(hl&&hl[k.dataset.m]?' '+hl[k.dataset.m]:''));});}
  };
  ctl.set(o.hl||{});
  svg.addEventListener('click',e=>{const k=e.target.closest('.k');if(k&&o.onKey) o.onKey(+k.dataset.m);});
  return ctl;
}

/* ----- Noten eintragen (Notenzeile zum Anklicken) ----- */
function staffInput(host,cfg){
  const N=cfg.cols, st={cols:Array.from({length:N},()=>[]),tool:'note',res:[]};
  host.innerHTML=`<div class="tools" role="group" aria-label="Werkzeuge"><button type="button" class="chip on" data-t="note">Note</button><button type="button" class="chip" data-t="sharp">♯</button><button type="button" class="chip" data-t="flat">♭</button><span class="grow"></span><button type="button" class="btn ghost sm" data-a="play">${ICON_PLAY}Anhören</button><button type="button" class="btn ghost sm" data-a="clear">Löschen</button></div><div class="staffwrap si"></div><p class="small muted si-h">Tippe auf eine Linie oder einen Zwischenraum, um eine ganze Note zu setzen. Mit ♯ oder ♭ setzt du das Vorzeichen direkt vor die Note. Tippe eine Note erneut an, um sie zu entfernen.</p>`;
  const wrap=$('.staffwrap',host);
  const fixed=cfg.fixed||[];
  function colNotes(ci){
    return (fixed[ci]||[]).map(p=>({p,cls:'fx'})).concat(st.cols[ci].map(p=>({p,cls:st.res[ci]||''})));
  }
  function draw(){
    wrap.innerHTML=staffSVG({cols:Array.from({length:N},(_,ci)=>({notes:colNotes(ci),label:cfg.labels&&cfg.labels[ci],sub:cfg.subs&&cfg.subs[ci]})),colW:cfg.colW||84,dLo:-3,dHi:15,input:true,aria:'Notenzeile zum Eintragen'});
  }
  function pos(e){
    const svg=$('svg',wrap), r=svg.getBoundingClientRect();
    const W=+svg.dataset.w,H=+svg.dataset.h,left=+svg.dataset.left,cw=+svg.dataset.colw,top=+svg.dataset.top,dHi=+svg.dataset.dhi;
    const x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
    return {ci:Math.floor((x-left)/cw),d:Math.round(dHi-(y-top)/5),x,y,left,cw,top,dHi};
  }

/* Prüft einen Akkord, den jemand in die Notenzeile eingetragen hat */
function checkChord(placed,root,type,inv){
  const exp=invert(buildChord(root,type),inv||0);
  const nm=a=>a.map(p=>cap(deRoot(p,false)).replace(/^(.)/,m=>m)).join(' – ');
  const expNames=exp.map(p=>noteName(p)).join(' – ');
  if(placed.length!==exp.length) return {ok:false,msg:`Hier gehören ${exp.length} Töne hin (du hast ${placed.length} gesetzt). Gesucht: ${expNames}.`};
  const pl=placed.slice().sort((a,b)=>a.d-b.d||a.a-b.a);
  for(let i=0;i<exp.length;i++){
    if(letterOf(pl[i])!==letterOf(exp[i])||pl[i].a!==exp[i].a) return {ok:false,msg:`Gesucht: ${expNames}${inv?' (tiefster Ton: '+noteName(exp[0])+')':''}.`};
    if(pl[i].d-pl[0].d!==exp[i].d-exp[0].d) return {ok:false,msg:`Die Töne haben die richtigen Namen, liegen aber nicht in der richtigen Reihenfolge übereinander. Gesucht: ${expNames}.`};
  }
  return {ok:true,msg:''};
}

/* ----- Fragen: Auswahl, Texteingabe, Runden ----- */
function mcQ(q,correct,wrongs,explain,extra){
  const w=uniq(wrongs.filter(x=>x!==correct));
  const opts=shuffle([{t:correct,ok:true}].concat(shuffle(w).slice(0,3).map(t=>({t,ok:false}))));
  return Object.assign({q,type:'mc',opts,explain:explain||''},extra||{});
}
const norm=s=>String(s).toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9#♯♭]/g,'');
function drawQ(q,box,answer,opt){
  opt=opt||{}; box.innerHTML='';
  box.appendChild(el(`<div class="qtxt">${q.q}</div>`));
  if(q.staff) box.appendChild(el(staffBox(q.staff)));
  if(q.audio){
    const b=el(`<button type="button" class="btn ghost">${ICON_PLAY}Anhören</button>`);
    b.onclick=()=>q.audio(); box.appendChild(b);
    if(q.auto) setTimeout(()=>q.audio(),150);
  }
  const done=(ok,msg)=>answer(ok,(msg||'')+(q.explain?' '+q.explain:''));
  if(q.type==='text'){
    const f=el(`<form class="trow"><input type="text" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eingeben" aria-label="Antwort"><button class="btn primary" type="submit">Prüfen</button></form>`);
    const hint=el('<p class="small muted hint" hidden></p>'); let tries=0;
    box.appendChild(f); box.appendChild(hint);
    f.onsubmit=e=>{
      e.preventDefault(); const inp=$('input',f), v=norm(inp.value); if(!v) return;
      tries++;
      if(q.accept.some(a=>norm(a)===v)){f.querySelectorAll('input,button').forEach(x=>x.disabled=true);done(tries===1,tries>1?'Mit Hinweis richtig.':'');}
      else if(tries===1&&q.hint&&!opt.noHint){hint.hidden=false;hint.textContent='Hinweis: '+q.hint;inp.select();}
      else{f.querySelectorAll('input,button').forEach(x=>x.disabled=true);done(false,'Gesucht war: '+q.show+'.');}
    };
    setTimeout(()=>{try{$('input',f).focus({preventScroll:true});}catch(e){}},50);
  }else{
    const wrap=el(`<div class="opts" style="--cols:${q.cols||(q.opts.length>4?3:2)}"></div>`);
    q.opts.forEach(o=>{
      const b=el(`<button type="button" class="opt">${o.t}</button>`);
      b.onclick=()=>{
        [...wrap.children].forEach((c,k)=>{c.disabled=true;if(q.opts[k].ok)c.classList.add('right');});
        if(!o.ok) b.classList.add('wrong');
        done(o.ok,o.fb||'');
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }
}
function rounds(host,cfg){
  const N=cfg.n||6; let i=0,score=0,locked=false; const missed=[];
  host.innerHTML=`<div class="rh"><span class="rc"></span><div class="bar"><i></i></div><span class="rs"></span></div><div class="rq"></div><div class="rfb" aria-live="polite"></div><div class="rn"></div>`;
  const rc=$('.rc',host),rs=$('.rs',host),bar=$('.bar i',host),rq=$('.rq',host),fb=$('.rfb',host),rn=$('.rn',host);
  function head(){rc.textContent=`Aufgabe ${Math.min(i+1,N)} von ${N}`;rs.textContent=`Richtig: ${score}`;bar.style.width=(i/N*100)+'%';}
  function next(){
    if(i>=N) return finish();
    locked=false; fb.innerHTML=''; rn.innerHTML=''; head();
    const q=cfg.gen(i);
    cfg.draw(q,rq,answer);
    rq.scrollIntoView&&0;
  }
  function answer(ok,msg){
    if(locked) return; locked=true;
    if(ok) score++; else missed.push(i+1);
    fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'Richtig.':'Nicht ganz.'}</strong> ${msg||''}</div>`;
    i++; rs.textContent=`Richtig: ${score}`; bar.style.width=(i/N*100)+'%';
    const b=el(`<button type="button" class="btn primary">${i>=N?'Ergebnis ansehen':'Weiter'}</button>`);
    b.onclick=next; rn.appendChild(b);
    try{b.focus({preventScroll:true});}catch(e){}
  }
  function finish(){
    const pct=Math.round(score/N*100);
    const msg=pct>=90?'Sehr sicher. Das sitzt.':pct>=60?'Gute Basis. Die Fehler lohnen einen zweiten Durchgang.':'Noch unsicher. Lies im Lernbereich nach und probiere es noch einmal.';
    host.innerHTML=`<div class="result"><div class="big">${score}<span>/${N}</span></div><p>${msg}</p><button type="button" class="btn primary" data-again>Noch einmal</button></div>`;
    $('[data-again]',host).onclick=()=>rounds(host,cfg);
    if(cfg.exId) markEx(cfg.exId,score/N);
    if(cfg.quizSec) markQuiz(cfg.quizSec,pct);
  }
  next();
}
function markEx(id,frac){ if(frac>=.6){S.ex[id]=1;save();refreshNav();} }
function markQuiz(sec,pct){ S.quiz[sec]=Math.max(S.quiz[sec]||0,pct);save();refreshNav(); }
function mcRounds(host,cfg){ rounds(host,Object.assign({draw:drawQ},cfg)); }
function withLevels(host,levels,run){
  host.innerHTML=`<div class="chips" role="group" aria-label="Schwierigkeit"></div><div class="lv"></div>`;
  const row=$('.chips',host),lv=$('.lv',host);
  levels.forEach((l,k)=>{
    const b=el(`<button type="button" class="chip${k===0?' on':''}">${l.label}</button>`);
    b.onclick=()=>{$$('.chip',row).forEach(c=>c.classList.toggle('on',c===b));run(lv,l);};
    row.appendChild(b);
  });

}
function tfRounds(host,exId,list,n){

  return mcQ(`Aus welchen Tönen besteht <strong>${nm}</strong>?`,s(ch),wr,`${nm} = ${CT[type].desc}: ${s(ch)}.`,{cols:1,audio:()=>sndChord(ch)});
};

/* ----- M5: Akkord-Symbolik ----- */
const SYM_PITCHES=[[0,0],[0,1],[1,-1],[1,0],[1,1],[2,-1],[2,0],[3,0],[3,1],[4,-1],[4,0],[4,1],[5,-1],[5,0],[5,1],[6,-1],[6,0]].map(([d,a])=>P(d,a));
const amChord=(p,minor)=>amRoot(p)+(minor?'m':'');
G.dtAm=()=>{
  const p=pick(SYM_PITCHES), minor=Math.random()<.5, dt=deRoot(p,minor), am=amChord(p,minor);
  const wr=shuffle(SYM_PITCHES.map(x=>amChord(x,minor)));
  if(L[mod(p.d,7)]==='B') wr.unshift(amChord(P(6,p.a===0?-1:0),minor));
  const note=L[mod(p.d,7)]==='B'?' Achtung: deutsch H = amerikanisch B, deutsch B = amerikanisch B♭.':'';
  return mcQ(`Wie schreibt man <strong>${dt}</strong> (deutsch) in amerikanischer Schreibweise?`,am,wr,`${dt} entspricht ${am}.${note}`,{cols:2});
};
G.amDt=()=>{
  const p=pick(SYM_PITCHES), minor=Math.random()<.5, dt=deRoot(p,minor), am=amChord(p,minor);
  const wr=shuffle(SYM_PITCHES.map(x=>deRoot(x,minor)));
  if(L[mod(p.d,7)]==='B') wr.unshift(deRoot(P(6,p.a===0?-1:0),minor));
  const note=L[mod(p.d,7)]==='B'?' Achtung: amerikanisch B = deutsch H, amerikanisch B♭ = deutsch B.':'';
  return mcQ(`Wie schreibt man <strong>${am}</strong> (amerikanisch) in deutscher Schreibweise?`,dt,wr,`${am} entspricht ${dt}.${note}`,{cols:2});
};
const M5T=['dur','moll','dur6','dur7','moll7','maj7','mmaj7'];
G.symbolDesc=()=>{
  const type=pick(M5T), root=rndRoot(type,0,6);
  const label=deRoot(root,false)+'-'+CT[type].desc;
  const wr=M5T.filter(t=>t!==type).map(t=>chordNameAM(root,t));
  return mcQ(`Welches amerikanische Symbol gehört zu <strong>${label}</strong>?`,chordNameAM(root,type),wr,
    `${label}: deutsch ${chordNameDE(root,type)}, amerikanisch ${chordNameAM(root,type)}.`,{cols:2,audio:()=>sndChord(buildChord(root,type))});
};
G.symbolStaff=()=>{
  const type=pick(M5T), root=rndRoot(type,0,6), ch=buildChord(root,type);
  const wr=M5T.filter(t=>t!==type).map(t=>chordNameAM(root,t));
  return mcQ('Welches Akkordsymbol (amerikanisch) passt zu diesem Akkord?',chordNameAM(root,type),wr,
    `${ch.map(noteName).join(' – ')} = ${CT[type].desc}. Deutsch: ${chordNameDE(root,type)}, amerikanisch: ${chordNameAM(root,type)}.`,
    {staff:withStaff([chordCol(ch)],120),audio:()=>sndChord(ch),cols:2});
};

/* ----- M6: Kadenzen ----- */
const pickKey=()=>pick(KEYS);
const chName=c=>chordNameDE(c.root,c.type);
G.keyChord=()=>{
  const k=pickKey(), ch=keyChords(k.tonic,k.mode), i=R(7), c=ch[i];
  const wr=[chordNameDE(c.root,c.type==='dur'?'moll':'dur')].concat(ch.filter((_,j)=>j!==i).map(chName));
  return mcQ(`Welcher Dreiklang steht in <strong>${keyName(k)}</strong> auf der <strong>${DEG[i]}. Stufe</strong>?`,chName(c),wr,
    `${keyName(k)}: ${ch.map(chName).join(' – ')}.${k.mode==='moll'?' (In Moll steht auf V meist ein Dur-Dreiklang, das harmonische Moll.)':''}`,
    {cols:2,audio:()=>sndChord(c.notes)});
};
const FN_OPTS={dur:['T','S','D','Tp','Sp','Dp'],moll:['t','s','D','tP','sP','(D)']};
G.keyFunc=()=>{
  const k=pickKey(), ch=keyChords(k.tonic,k.mode), pool=ch.filter(c=>c.fn!=='—');
  const c=pick(pool), nm=FUN_NAME[c.fn];
  return mcQ(`Welche Funktion hat <strong>${chName(c)}</strong> in <strong>${keyName(k)}</strong>?`,c.fn,FN_OPTS[k.mode],
    `${chName(c)} steht auf der ${DEG[c.deg]}. Stufe von ${keyName(k)} und ist die ${nm}.`,{cols:3,audio:()=>sndChord(c.notes)});
};
G.funcChord=()=>{
  const k=pickKey(), ch=keyChords(k.tonic,k.mode), pool=ch.filter(c=>c.fn!=='—'), c=pick(pool);
  const wr=pool.filter(x=>x!==c).map(chName);
  return mcQ(`Welcher Dreiklang ist in <strong>${keyName(k)}</strong> die <strong>${FUN_NAME[c.fn].replace(' (Dominant-Parallele)','')}</strong> (${c.fn})?`,chName(c),wr,
    `In ${keyName(k)} ist ${c.fn} der Dreiklang auf der ${DEG[c.deg]}. Stufe: ${chName(c)}.`,{cols:2});
};
const CAD={
  'T – S – D – T':[0,3,4,0],'T – D – T':[0,4,0],'T – S – T':[0,3,0],'T – D – S – T':[0,4,3,0],'T – Tp – S – D':[0,5,3,4]
};
G.cadHear=()=>{
  const k=pickKey(), names=Object.keys(CAD), name=pick(names), ch=keyChords(k.tonic,k.mode), chs=CAD[name].map(i=>ch[i]);
  const show=s=>k.mode==='moll'?s.replace(/Tp/g,'tP').replace(/T/g,'t').replace(/S/g,'s'):s;
  const pool=shuffle([name].concat(shuffle(names.filter(n=>n!==name)).slice(0,3)));
  return {q:`Höre die Akkordfolge in ${keyName(k)}. Welche Funktionsfolge ist es?`,type:'mc',cols:1,auto:true,
    opts:pool.map(n=>({t:show(n),ok:n===name})),
    audio:()=>Snd.cadence(chs),explain:`Es war ${show(name)}: ${chs.map(chName).join(' – ')}.`};
};
G.cadMissing=()=>{
  const k=pickKey(), ch=keyChords(k.tonic,k.mode), seq=[0,3,4,0], chs=seq.map(i=>ch[i]), miss=1+R(2);
  const labs=chs.map((c,i)=>i===miss?'?':c.fn);
  return mcQ(`Welche Funktion fehlt in dieser Kadenz in <strong>${keyName(k)}</strong> (an der Stelle ?)`,chs[miss].fn,FN_OPTS[k.mode].filter(x=>x!==chs[miss].fn),
    `In der einfachen Kadenz folgt auf T die S, dann D, dann wieder T. Gesucht: ${chs[miss].fn} = ${chName(chs[miss])}.`,
    {staff:{cols:chs.map((c,i)=>chordCol(c.notes,labs[i],i===miss?'':chName(c))),colW:84},audio:()=>Snd.cadence(chs),cols:3});
};
const VZ={C:0,G:1,D:2,A:3,E:4,F:-1,B:-2,Es:-3,As:-4};
const vzTxt=n=>n===0?'keine Vorzeichen':n>0?n+(n===1?' Kreuz':' Kreuze'):(-n)+' b-Vorzeichen';
G.circleVz=()=>{
  const k=pick(KEYS_DUR), nm=deRoot(k.tonic,false), n=VZ[nm];
  const wr=[n+1,n-1,-n,n+2].filter(x=>x!==n).map(vzTxt);
  return mcQ(`Wie viele Vorzeichen hat <strong>${nm}-Dur</strong>?`,vzTxt(n),wr,
    'Am Quintenzirkel: oben C-Dur ohne Vorzeichen, im Uhrzeigersinn je ein Kreuz mehr, gegen den Uhrzeigersinn je ein b mehr.',{cols:2});
};
G.circleNeighbor=()=>{
  const k=pick(KEYS_DUR), ch=keyChords(k.tonic,'dur'), nm=keyName(k);
  const t=pick([['Dominante',4],['Subdominante',3],['Tonika-Parallele',5],['Subdominant-Parallele',1],['Dominant-Parallele',2]]);
  const c=ch[t[1]], wr=ch.filter((_,i)=>i!==t[1]&&i!==6).map(chName);
  return mcQ(`Welcher Dreiklang ist in <strong>${nm}</strong> die <strong>${t[0]}</strong>?`,chName(c),wr,
    `Im Quintenzirkel liegen Subdominante und Dominante neben der Tonika, die Parallelen innen: ${nm}: T ${chName(ch[0])}, S ${chName(ch[3])}, D ${chName(ch[4])}, Tp ${chName(ch[5])}, Sp ${chName(ch[1])}, Dp ${chName(ch[2])}.`,{cols:2});
};

LESSON.m1=()=>{
  const dia=[['r',1],['g',2],['g',3],['r',4],['r',5],['g',6],['g',7],['r',8]];
  const diaCols=dia.map(([q,n],i)=>({notes:[{p:C4},{p:ivlC(q,n)}],label:['Prime','Sekunde','Terz','Quarte','Quinte','Sexte','Septime','Oktave'][i]}));
  const all1=[['r',1],['k',2],['g',2],['k',3],['g',3],['r',4],['ü',4],['v',5],['r',5]], all2=[['k',6],['g',6],['k',7],['g',7],['r',8],['k',9],['g',9],['k',10],['g',10]];
  const sext=stepFig(P(1),'g',6), terz=stepFig(P(3),'g',3);
  const fine=[[P(3),P(5)],[P(3),P(5,-1)],[P(3,1),P(5)]].map(([a,b])=>{const i=ivlOf(a,b);return {notes:[{p:a},{p:b}],label:i.name.replace('große','große').replace('kleine','kleine'),sub:(midi(b)-midi(a))+' Halbtonschritte'};});
  return `
  <p class="lead">Der Abstand zwischen zwei Tönen heißt <strong>Intervall</strong>. Man kann Intervalle von jedem beliebigen Ton aus aufwärts und abwärts bilden, und die beiden Töne dürfen gleichzeitig oder nacheinander erklingen.</p>
  <h3>Leitereigene Intervalle vom c' aus</h3>
  ${fig(staffBox({cols:diaCols,colW:80,dLo:-2,dHi:12,aria:'Leitereigene Intervalle vom c aus nach oben'}),'Prime bis Oktave über c\'. Tippe auf den Lautsprecher, um jedes Intervall zu hören.')}
  <div class="btnrow">${dia.map(([q,n])=>{const it=IVL_LIST.find(x=>x.q===q&&x.n===n);return `<span class="small">${IVN[n]}</span>${pb(()=>Snd.ivl(C4,ivlC(q,n)),IVN[n])}`;}).join('')}</div>
  <h3>Grobbestimmung: Tonstufen zählen</h3>
  <p>Zuerst bestimmst du den Namen des Intervalls nur an der Position der Noten im Notensystem, <em>unabhängig von den Vorzeichen</em>. Dabei zählst du die Tonstufen <strong>einschließlich Ausgangs- und Endnote</strong>. Um die genaue Zahl der Halbtonschritte geht es hier noch nicht.</p>
  <div class="twocol"><div>${fig(sext,'Sexte: d\' bis b\', sechs Tonstufen gezählt.')}</div><div>${fig(terz,'Terz: f\' bis a\', drei Tonstufen gezählt.')}</div></div>
  <h3>Feinbestimmung: Halbtonschritte zählen</h3>
  <p>Erst bei der Feinbestimmung wird der genaue Abstand bestimmt, und zwar anhand der Halbtonschritte. Der erste Halbtonschritt ist dabei der <em>fertige</em> Halbtonschritt ausgehend von der Ausgangsnote. Von f' bis a' sind es vier, von f' bis as' nur drei.</p>
  ${fig(staffBox({cols:fine,colW:130,dLo:0,dHi:12}),'Gleiche Grobbestimmung (Terz), aber unterschiedliche Feinbestimmung.')}
  ${merke('Merke','Grobbestimmung = Tonstufen zählen (mit Vorzeichen-Unabhängigkeit). Feinbestimmung = Halbtonschritte zählen. Daraus ergibt sich: <strong>rein (r), klein (k), groß (g), vermindert (v), übermäßig (ü)</strong>.')}
  <h3>Alle Intervalle von c' aus</h3>
  ${fig(mkIvlFig(all1,76),'Prime bis Quinte')}
  ${playRow(all1)}
  ${fig(mkIvlFig(all2,76),'Sexte bis große Dezime')}
  ${playRow(all2)}
  <h3>Halbtonschritte im Überblick</h3>
  <div class="tw"><table class="tbl"><thead><tr><th>Intervall</th><th class="c">Kürzel</th><th class="c">Halbtonschritte</th><th></th></tr></thead><tbody>
  ${IVL_LIST.map(i=>`<tr><td>${i.name}</td><td class="c">${i.ab}</td><td class="c">${i.hs}</td><td class="c">${playIvl(C4,ivlC(i.q,i.n),'mel')}</td></tr>`).join('')}
  </tbody></table></div>
  ${merke('Klausurtipp','Rein sind nur Prime, Quarte, Quinte und Oktave. Terzen, Sexten und Septimen sind groß oder klein. Die übermäßige Quarte und die verminderte Quinte klingen gleich (je 6 Halbtonschritte) und werden Tritonus genannt.')}
  <h3>Konsonanz und Dissonanz</h3>
  <p><strong>Konsonant:</strong> Prime, Terz, Quarte, Quinte, Sexte, Oktave. <strong>Dissonant:</strong> Sekunde und Septime.</p>
  <h3>Umkehrung von Intervallen</h3>
  <p>Wenn du den unteren Ton eine Oktave höher setzt, entsteht die Umkehrung. Die Stufenzahlen ergeben zusammen 9. Aus rein wird rein, aus groß wird klein, aus klein wird groß, aus übermäßig wird vermindert.</p>
  <div class="tw"><table class="tbl"><tbody><tr><th>Prime ⇄ Oktave</th><th>Sekunde ⇄ Septime</th><th>Terz ⇄ Sexte</th><th>Quarte ⇄ Quinte</th></tr><tr><td>1 + 8 = 9</td><td>2 + 7 = 9</td><td>3 + 6 = 9</td><td>4 + 5 = 9</td></tr></tbody></table></div>
  ${vidBox('m1')}`;
};
LESSON.m2=()=>{
  const cdur=buildChord(C4,'dur'), cmoll=buildChord(C4,'moll');
  const triC=keyChords(C4,'dur');
  const lab=['Dur','Moll','Moll','Dur','Dur','Moll','zwei kl. Terzen'];
  const pianoHtml=id=>`<div id="${id}"></div>`;
  return `
  <p class="lead">Ein Dreiklang besteht aus drei Tönen, die gleichzeitig oder nacheinander erklingen. Die Töne liegen im Abstand einer Terz übereinander (<strong>Terzschichtung</strong>): Grundton, Terz und Quinte.</p>
  <h3>Dur und Moll</h3>
  <p>Es gibt Dur- und Moll-Dreiklänge. Die Größe der Terz bestimmt das <strong>Tongeschlecht</strong>: Die Dur-Terz hat vier Halbtonschritte, die Moll-Terz drei. Liegt die große Terz unten und die kleine oben, ist es ein Dur-Dreiklang. Liegt die kleine Terz unten und die große oben, ist es ein Moll-Dreiklang.</p>
  <div class="twocol">
   <div>${fig(staffBox({cols:[chordCol(cdur,'C-Dur','gr. Terz + kl. Terz')],colW:150,dLo:-2,dHi:10}),'Dur: 4 + 3 Halbtonschritte '+pb(()=>sndChord(cdur),'C-Dur hören')+pb(()=>sndChord(cdur,'arp'),'C-Dur gebrochen')+'')}</div>
   <div>${fig(staffBox({cols:[chordCol(cmoll,'c-Moll','kl. Terz + gr. Terz')],colW:150,dLo:-2,dHi:10}),'Moll: 3 + 4 Halbtonschritte '+pb(()=>sndChord(cmoll),'c-Moll hören')+pb(()=>sndChord(cmoll,'arp'),'c-Moll gebrochen')+'')}</div>
  </div>
  ${merke('Schreibweise','In der deutschen Schreibweise werden <strong>Dur-Akkorde mit Großbuchstaben</strong> (C, G, Fis) und <strong>Moll-Akkorde mit Kleinbuchstaben</strong> (c, g, fis) bezeichnet.')}
  <h3>Die sieben Dreiklänge einer Tonart</h3>
  <p>Dreiklänge kann man über jedem beliebigen Ton bilden. Dadurch gibt es in jeder Tonart sieben Dreiklänge mit tonleitereigenen Tönen. Hier in C-Dur:</p>
  ${fig(staffBox({cols:triC.map((c,i)=>chordCol(c.notes,lab[i])),colW:76,dLo:-2,dHi:12}),'Dur, Moll, Moll, Dur, Dur, Moll und ein Dreiklang aus zwei kleinen Terzen (vermindert).')}
  <div class="btnrow">${triC.map((c,i)=>`<span class="small">${DEG[i]}</span>`+pb(()=>sndChord(c.notes),DEG[i]+'. Stufe hören')).join('')}</div>
  ${merke('Merke','Dreiklang = Grundton + Terz + Quinte. Dur = große Terz unten, Moll = kleine Terz unten. Beide haben dieselbe Quinte (7 Halbtonschritte über dem Grundton).')}
  <h3>Selbst ausprobieren</h3>
  <p>Bei den Übungen findest du einen Klaviatur-Baukasten, mit dem du Dur und Moll über jedem Grundton hörst.</p>
  ${vidBox('m2')}`;
};
LESSON.m3=()=>{
  const ch=buildChord(C4,'dur'), cols=[0,1,2].map(i=>chordCol(invert(ch,i),INV_SHORT[i]==='GS'?'Grundstellung':INV_SHORT[i]+'mkehrung'.replace('1. Umkehrung','').replace('2. Umkehrung',''),['Aufbau über dem Grundton','Aufbau über der Terz','Aufbau über der Quinte'][i]));
  cols[0].label='Grundstellung';cols[1].label='1. Umkehrung';cols[2].label='2. Umkehrung';
  return `
  <p class="lead">Von jedem Dreiklang gibt es auch <strong>Umkehrungen</strong>. Dafür werden die Töne in einer anderen Reihenfolge übereinandergeschichtet. Es ergeben sich drei verschiedene Stellungen.</p>
  ${fig(staffBox({cols,colW:130,dLo:-2,dHi:10,aria:'C-Dur in Grundstellung und zwei Umkehrungen'}),'C-Dur: c-e-g, e-g-c, g-c-e '+pb(()=>sndChord(invert(ch,0)),'Grundstellung')+pb(()=>sndChord(invert(ch,1)),'1. Umkehrung')+pb(()=>sndChord(invert(ch,2)),'2. Umkehrung'))}
  <div class="tw"><table class="tbl"><thead><tr><th>Stellung</th><th>Basston</th><th>Name</th><th>Intervalle über dem Basston</th></tr></thead><tbody>
   <tr><td>Grundstellung</td><td>Grundton</td><td>Grundakkord</td><td>Terz, Quinte</td></tr>
   <tr><td>1. Umkehrung</td><td>Terz</td><td><strong>Sextakkord</strong></td><td>Terz, Sexte</td></tr>
   <tr><td>2. Umkehrung</td><td>Quinte</td><td><strong>Quartsextakkord</strong></td><td>Quarte, Sexte</td></tr></tbody></table></div>
  <p>Ein Dreiklang der <strong>ersten Umkehrung</strong> heißt Sextakkord, weil zwischen dem tiefsten und dem höchsten Ton (in diesem Fall dem Grundton) eine Sexte liegt. Ein Dreiklang der <strong>zweiten Umkehrung</strong> heißt Quartsextakkord, weil über dem tiefsten Ton eine Quarte und eine Sexte liegen.</p>
  ${merke('So bestimmst du einen umgekehrten Akkord','Bring den Akkord in die <strong>Grundstellung</strong>, also in Terzschichtung. Der unterste Ton ist dann der Grundton, und du erkennst das Tongeschlecht an der unteren Terz. Beispiel: e–g–c → Terzschichtung c–e–g → C-Dur in der 1. Umkehrung.')}
  ${vidBox('m3')}`;
};
LESSON.m4=()=>{
  const aug=buildChord(P(0),'uber'), dim=buildChord(P(6),'verm'), g7=buildChord(P(4),'dur7'), c6=buildChord(P(0),'dur6');
  const sixes=[['dur6',P(0)],['moll6',P(0)],['dur6',P(4)]], sevens=[['dur7',P(4)],['moll7',P(1)],['maj7',P(0)]];
  const mk=(list)=>staffBox({cols:list.map(([t,r])=>chordCol(buildChord(r,t),chordNameDE(r,t),CT[t].desc.replace('mit hinzugefügter ','+ ').replace('mit ','+ '))),colW:130,dLo:-2,dHi:11});
  return `
  <p class="lead">Neben Dur und Moll, die aus einer großen und einer kleinen Terz bestehen, gibt es zwei weitere Dreiklänge. Dazu kommen Vierklänge.</p>
  <h3>Übermäßige und verminderte Dreiklänge</h3>
  <p>Bei zwei übereinanderliegenden <strong>großen Terzen</strong> spricht man von einem <strong>übermäßigen</strong> Dreiklang. Er kann nicht mit den leitereigenen Tönen einer Tonart gebildet werden. Bei zwei übereinanderliegenden <strong>kleinen Terzen</strong> spricht man von einem <strong>verminderten</strong> Dreiklang. Er entsteht zum Beispiel über dem siebten Ton einer Dur-Tonleiter.</p>
  <div class="twocol">
   <div>${fig(staffBox({cols:[chordCol(aug,'c überm.','4 + 4 Halbtonschritte')],colW:150,dLo:-2,dHi:10}),'übermäßig: c–e–gis '+pb(()=>sndChord(aug),'übermäßig hören'))}</div>
   <div>${fig(staffBox({cols:[chordCol(dim,'h verm.','3 + 3 Halbtonschritte')],colW:150,dLo:-2,dHi:10}),'vermindert: h–d–f '+pb(()=>sndChord(dim),'vermindert hören'))}</div>
  </div>
  <div class="tw"><table class="tbl"><thead><tr><th>Dreiklang</th><th class="c">untere Terz</th><th class="c">obere Terz</th><th class="c">Quinte</th></tr></thead><tbody>
   <tr><td>Dur</td><td class="c">groß (4)</td><td class="c">klein (3)</td><td class="c">rein</td></tr>
   <tr><td>Moll</td><td class="c">klein (3)</td><td class="c">groß (4)</td><td class="c">rein</td></tr>
   <tr><td>vermindert</td><td class="c">klein (3)</td><td class="c">klein (3)</td><td class="c">vermindert</td></tr>
   <tr><td>übermäßig</td><td class="c">groß (4)</td><td class="c">groß (4)</td><td class="c">übermäßig</td></tr></tbody></table></div>
  <h3>Vierklänge: Sext- und Sept-Akkorde</h3>
  <p>Vierklänge entstehen durch das Hinzufügen eines vierten Tons. Am häufigsten wird eine <strong>kleine Septime</strong> hinzugefügt, also eine weitere Terzschichtung. In der Jazz- und Popularmusik wird oft auch eine Sexte hinzugenommen, fast immer eine <strong>große Sexte</strong>. Durch die zusätzlichen Töne klingen die Akkorde interessanter: Es entsteht mehr Spannung oder mehr Offenheit. Die zusätzlichen Töne werden mit hochgestellten Zahlen bezeichnet.</p>
  ${fig(mk(sixes),'Sext-Akkorde (Dreiklang + große Sexte): C<sup>6</sup>, c<sup>6</sup>, G<sup>6</sup> '+sixes.map(([t,r])=>pb(()=>sndChord(buildChord(r,t)),chordNameDE(r,t))).join(''))}
  ${fig(mk(sevens),'Sept-Akkorde (Dreiklang + Septime): G<sup>7</sup> (kleine Septime), d<sup>7</sup>, C<sup>maj7</sup> (große Septime) '+sevens.map(([t,r])=>pb(()=>sndChord(buildChord(r,t)),chordNameDE(r,t))).join(''))}
  ${merke('Merke','Dur 7 = Dur-Dreiklang + kleine Septime (G7 = g–h–d–f). Moll 7 = Moll-Dreiklang + kleine Septime. Bei maj7 kommt die große Septime dazu. Bei 6 kommt die große Sexte dazu.')}
  ${vidBox('m4')}`;
};
LESSON.m5=()=>{
  const tabRow=(minor)=>{
    const half=[SYM_PITCHES.slice(0,8),SYM_PITCHES.slice(8)];
    return half.map(row=>`<div class="tw"><table class="tbl"><tbody><tr><th>dt.</th>${row.map(p=>`<td class="c">${deRoot(p,minor)}</td>`).join('')}</tr><tr><th>am.</th>${row.map(p=>`<td class="c">${amChord(p,minor)}</td>`).join('')}</tr></tbody></table></div>`).join('');
  };
  const rows=[['C-Dur','C','C','dur'],['C-Moll','c','Cm','moll'],['C-Dur mit hinzugefügter großer Sexte','C<sup>6</sup>','C<sup>6</sup>','dur6'],['C-Dur mit kleiner Septime','C<sup>7</sup>','C<sup>7</sup>','dur7'],['C-Moll mit kleiner Septime','c<sup>7</sup>','Cm<sup>7</sup>','moll7'],['C-Dur mit großer Septime','C<sup>maj7</sup> oder C<sup>Δ</sup>','C<sup>maj7</sup> oder C<sup>Δ</sup>','maj7'],['C-Moll mit großer Septime','c<sup>maj7</sup> oder c<sup>Δ</sup>','Cm<sup>maj7</sup> oder Cm<sup>Δ</sup>','mmaj7']];
  return `
  <p class="lead">Einige Akkorde haben in der deutschen und der amerikanischen Schreibweise andere Namen.</p>
  ${merke('Die Falle: H und B','Deutsch <strong>H</strong> = amerikanisch <strong>B</strong>. Deutsch <strong>B</strong> = amerikanisch <strong>B♭</strong>. Amerikanisch gibt es kein H.')}
  <h3>Dur-Akkorde</h3>${tabRow(false)}
  <h3>Moll-Akkorde</h3>${tabRow(true)}
  <p>Die Moll-Akkorde bekommen in der amerikanischen Schreibweise ein <strong>m</strong> hinter den Großbuchstaben. In der deutschen Schreibweise genügt der Kleinbuchstabe.</p>
  <h3>Akkord-Symbole für die Feinbestimmung</h3>
  <div class="tw"><table class="tbl"><thead><tr><th>Akkord</th><th>dt.</th><th>am.</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="c">${pb(()=>sndChord(buildChord(C4,r[3])),r[0])}</td></tr>`).join('')}
  </tbody></table></div>
  ${merke('Merke','Zahlen und Zusätze werden hochgestellt. 6 = große Sexte, 7 = kleine Septime, maj7 oder Δ = große Septime. Ein m (am.) oder Kleinbuchstabe (dt.) heißt Moll.')}
  ${vidBox('m5')}`;
};
LESSON.m6=()=>{
  const cd=keyChords(C4,'dur'), dm=keyChords(P(1),'moll');
  const stufen=['I','II','III','IV','V','VI','VII'];
  const cdLab=['C','d','e','F','G','a','vermindert'];
  const dmLab=['d','vermindert','F','g','a','A','B'.replace('B','B')];
  const dmN=dm.map(c=>chordNameDE(c.root,c.type));
  const cadC=[0,3,4,0].map(i=>cd[i]), cadD=[0,3,4,0].map(i=>dm[i]), fnN=['Tonika','Subdominante','Dominante','Tonika'];
  const nebCd=[cd[0],cd[1],cd[2],cd[3],cd[4],cd[5],cd[6]], dmFn=['t','vermindert','tP','s','D','sP','(D)'];
  return `
  <p class="lead">In jeder Dur-Tonart kann man über jedem Ton einen Dreiklang bilden. Es ergeben sich drei Dur- und drei Moll-Dreiklänge sowie ein verminderter Dreiklang.</p>
  <h3>Dreiklänge in Dur</h3>
  <p>Die Dur-Dreiklänge stehen auf den Tonstufen <strong>I, IV und V</strong>, die Moll-Dreiklänge auf den Stufen <strong>II, III und VI</strong>, der verminderte Dreiklang auf der Stufe <strong>VII</strong>.</p>
  ${fig(staffBox({cols:cd.map((c,i)=>chordCol(c.notes,cdLab[i],stufen[i])),colW:82,dLo:-2,dHi:12}),'C-Dur '+cd.map((c,i)=>pb(()=>sndChord(c.notes),stufen[i]+'. Stufe')).join(''))}
  <h3>Dreiklänge in Moll</h3>
  <p>Bei Moll stehen die Moll-Dreiklänge auf den Stufen <strong>I, IV und V</strong>, die Dur-Dreiklänge auf den Stufen <strong>III, VI und VII</strong> und der verminderte Dreiklang auf der Stufe <strong>II</strong>. Die V. Stufe ist aus harmonischen Gründen meistens in Dur (<strong>harmonisches Moll</strong>), dann braucht sie ein Versetzungszeichen.</p>
  ${fig(staffBox({cols:dm.map((c,i)=>chordCol(c.notes,dmN[i],stufen[i])),colW:82,dLo:-2,dHi:12}),'d-Moll (V. Stufe als Dur-Dreiklang mit cis) '+dm.map((c,i)=>pb(()=>sndChord(c.notes),stufen[i]+'. Stufe')).join(''))}
  <h3>Kadenz und Funktionen</h3>
  <p>Bestimmte Abfolgen von Akkorden mit mehr oder weniger starken Schlusswirkungen nennt man <strong>Kadenz</strong>. Die Dreiklänge erfüllen dabei erkennbare harmonische <strong>Funktionen</strong>:</p>
  <ul>
   <li>Der Dreiklang auf der <strong>ersten</strong> Stufe heißt <strong>Tonika</strong>. Er ruft ein Grundtonempfinden hervor.</li>
   <li>Der Dreiklang auf der <strong>vierten</strong> Stufe heißt <strong>Subdominante</strong>. Er strebt zur fünften Stufe.</li>
   <li>Der Dreiklang auf der <strong>fünften</strong> Stufe heißt <strong>Dominante</strong> und strebt zurück zur Tonika. Das Streben kann durch eine hinzugefügte Septime verstärkt werden.</li>
  </ul>
  <p>Tonika, Subdominante und Dominante sind die <strong>Hauptfunktionen</strong>. Die einfache Kadenz hat die Stufenfolge <strong>I – IV – V – I</strong>.</p>
  <div class="twocol">
   <div>${fig(staffBox({cols:cadC.map((c,i)=>chordCol(c.notes,fnN[i],['I','IV','V','I'][i])),colW:80,dLo:-2,dHi:11}),'Kadenz C-Dur '+pb(()=>Snd.cadence(cadC),'Kadenz C-Dur'))}</div>
   <div>${fig(staffBox({cols:cadD.map((c,i)=>chordCol(c.notes,fnN[i],['I','IV','V','I'][i])),colW:80,dLo:-2,dHi:11}),'Kadenz d-Moll '+pb(()=>Snd.cadence(cadD),'Kadenz d-Moll'))}</div>
  </div>
  <h3>Nebenfunktionen</h3>
  <p>Außer den drei Hauptfunktionen gibt es drei <strong>Nebenfunktionen</strong>. Sie werden nach den parallelen Hauptfunktionen benannt: <strong>Tonika-Parallele</strong>, <strong>Subdominant-Parallele</strong> und <strong>Dominant-Parallele</strong>. Bei Dur liegen die Nebenfunktionen eine <strong>kleine Terz unter</strong> der jeweiligen Hauptfunktion, bei Moll eine <strong>kleine Terz über</strong> der jeweiligen Hauptfunktion.</p>
  ${fig(staffBox({cols:cd.map((c,i)=>chordCol(c.notes,c.fn==='—'?'vermindert':c.fn)),colW:82,dLo:-2,dHi:12}),'C-Dur: T, Sp, Dp, S, D, Tp')}
  ${fig(staffBox({cols:dm.map((c,i)=>chordCol(c.notes,c.fn==='—'?'vermindert':c.fn)),colW:82,dLo:-2,dHi:12}),'d-Moll: t, tP, s, D, sP, (D)')}
  <h3>Schreibweise der Akkord-Funktionen</h3>
  <div class="tw"><table class="tbl"><thead><tr><th></th><th>T / t</th><th>S / s</th><th>D</th></tr></thead><tbody>
   <tr><th>Dur</th><td>T Tonika</td><td>S Subdominante</td><td>D Dominante</td></tr>
   <tr><th></th><td>Tp Tonika-Parallele</td><td>Sp Subdominant-Parallele</td><td>Dp Dominant-Parallele</td></tr>
   <tr><th>Moll</th><td>t Tonika</td><td>s Subdominante</td><td>D Dominante</td></tr>
   <tr><th></th><td>tP Tonika-Parallele</td><td>sP Subdominant-Parallele</td><td>dP/(D) *</td></tr></tbody></table></div>
  <p class="small muted">* Die Parallele zur Dominante in Moll ist häufig eine Zwischendominante, die zur Tonika-Parallele strebt. Zwischendominanten werden als eingeklammertes D geschrieben.</p>
  <h3>Der Quintenzirkel als Hilfsmittel</h3>
  <p>Im Quintenzirkel sind alle Dreiklänge im Quintabstand wie auf einer Uhr angeordnet. Oben steht in der Regel C-Dur, auf 1 Uhr G-Dur, auf 11 Uhr F-Dur usw. Die Hauptdreiklänge liegen nebeneinander, die Nebendreiklänge liegen gegenüber im Inneren des Kreises. Tippe auf eine Tonart, um zu sehen, wie sich die sechs Funktionen auf den Kreis legen.</p>
  <div id="qz-host"></div>

/* Aufgaben zum Eintragen von Noten */
function inputRounds(host,cfg){
  const N=cfg.n; let i=0,score=0;
  function task(){
    if(i>=N){
      const pct=Math.round(score/N*100);
      host.innerHTML=`<div class="result"><div class="big">${score}<span>/${N}</span></div><p>${pct>=90?'Sehr sicher. Das sitzt.':pct>=60?'Gute Basis. Wiederhole die Aufgaben, die nicht geklappt haben.':'Noch unsicher. Lies im Lernbereich nach und versuche es erneut.'}</p><button type="button" class="btn primary" data-again>Noch einmal</button></div>`;
      $('[data-again]',host).onclick=()=>inputRounds(host,cfg); markEx(cfg.exId,score/N); return;
    }
    const t=cfg.gen(i);
    host.innerHTML=`<div class="rh"><span>Aufgabe ${i+1} von ${N}</span><div class="bar"><i style="width:${i/N*100}%"></i></div><span>Richtig: ${score}</span></div><div class="qtxt">${t.text}</div><div class="si-host"></div><div class="btnrow"><button type="button" class="btn primary" data-chk>Prüfen</button></div><div class="rfb" aria-live="polite"></div>`;
    const api=staffInput($('.si-host',host),{cols:t.cols,fixed:t.fixed,labels:t.labels,subs:t.subs,colW:t.colW||92});
    const fb=$('.rfb',host), chk=$('[data-chk]',host);
    chk.onclick=()=>{
      const r=t.check(api);
      api.mark(r.marks);
      i++; if(r.ok) score++;
      chk.disabled=true;
      fb.innerHTML=`<div class="fb ${r.ok?'ok':'bad'}"><strong>${r.ok?'Richtig.':'Nicht ganz.'}</strong> ${r.msg||''}</div>${r.ok?'':`<p class="small muted">Lösung:</p>${t.solution()}`}`;
      const nb=el(`<button type="button" class="btn primary">${i>=N?'Ergebnis ansehen':'Weiter'}</button>`);
      nb.onclick=task; fb.appendChild(nb);
      const pl=el(`<button type="button" class="btn ghost">${ICON_PLAY}Lösung anhören</button>`); pl.onclick=t.play; fb.appendChild(pl);
      try{nb.focus({preventScroll:true});}catch(e){}
    };
  }
  task();
}
const chk1=(api,ci,root,type,inv)=>{const v=api.value()[ci];return checkChord(v,root,type,inv||0);};
function taskTriad(root,type,inv,label){
  const exp=invert(buildChord(root,type),inv||0);
  return {text:`Schreibe den Dreiklang <strong>${label}</strong>${inv?' ('+INV_LABEL[inv]+')':''} in die Notenzeile.`,cols:1,labels:[label+(inv?' · '+INV_SHORT[inv]:'')],colW:130,
    check:api=>{const r=chk1(api,0,root,type,inv);r.marks=[r.ok?'ok':'bad'];if(r.ok)r.msg='Die Terzschichtung stimmt.';return r;},
    solution:()=>sol(exp,label),play:()=>sndChord(exp)};
}
function taskTriadOnRoot(root,type){
  const exp=buildChord(root,type), nm=chordNameDE(root,type);
  return {text:`Baue über <strong>${noteName(root)}</strong> einen <strong>${type==='dur'?'Dur':'Moll'}-Dreiklang</strong> (${nm}). Der Grundton ist vorgegeben.`,cols:1,fixed:[[root]],labels:[nm],colW:130,
    check:api=>{const r=chk1(api,0,root,type,0);r.marks=[r.ok?'ok':'bad'];if(r.ok)r.msg=stackExplain(type);return r;},
    solution:()=>sol(exp,nm),play:()=>sndChord(exp)};
}
function taskIvlWrite(){
  for(let k=0;k<300;k++){
    const it=pick(IVL_LIST.filter(x=>x.n>1)), dir=Math.random()<.4?-1:1, base=P(dir>0?rint(0,5):rint(6,10),Math.random()<.25?pick([-1,1]):0);
    if(!rootNameOk(base)) continue;
    const t=addInterval(base,it.q,it.n,dir);
    if(Math.abs(t.a)>1||t.d<-3||t.d>14) continue;
    return {text:`Ergänze den fehlenden Ton: <strong>${it.name}</strong> (${it.ab}), <strong>${dir>0?'aufwärts':'abwärts'}</strong> von ${noteName(base)}.`,cols:1,fixed:[[base]],labels:[it.ab+(dir>0?' ↑':' ↓')],colW:130,
      check:api=>{
        const pl=api.placed()[0], ok=pl.length===1&&sameP(pl[0],t);
        let msg=ok?`${cap(it.name)}: ${it.n} Stufen, ${it.hs} Halbtonschritte.`:'';
        if(!ok){ if(pl.length===1&&pl[0].d===t.d) msg=`Die Stufe stimmt, aber die Halbtonschritte nicht: Gesucht ist ${noteName(t)} (${it.hs} Halbtonschritte).`; else if(pl.length!==1) msg='Setze genau eine Note.'; else msg=`Zähle zuerst ${it.n} Stufen ${dir>0?'aufwärts':'abwärts'} (Grobbestimmung), dann die Halbtonschritte. Gesucht: ${noteName(t)}.`;}
        return {ok,msg,marks:[ok?'ok':'bad']};},
      solution:()=>staffBox({cols:[{notes:[{p:base},{p:t,cls:'ok'}]}],colW:110,dLo:-2,dHi:15}),play:()=>Snd.ivl(base,t,'mel')};
  }
}
const KEY_TASK_COLS={dur:[['T',0],['Sp',1],['Dp',2],['S',3],['D',4],['Tp',5]],moll:[['t',0],['tP',2],['s',3],['D',4],['sP',5],['(D)',6]]};
function taskKeyFunctions(k){
  const chs=keyChords(k.tonic,k.mode), spec=KEY_TASK_COLS[k.mode], nm=keyName(k);

function taskCadence(k){
  const chs=keyChords(k.tonic,k.mode), seq=[0,3,4,0].map(i=>chs[i]), nm=keyName(k), labs=k.mode==='dur'?['T','S','D','T']:['t','s','D','t'];
  return {text:`Schreibe die Kadenz <strong>${nm}</strong> (${labs.join(' – ')}, Stufen I – IV – V – I).`,cols:4,labels:labs,colW:92,
    check:api=>{
      const v=api.value(), marks=[], bad=[];
      seq.forEach((c,ci)=>{const r=checkChord(v[ci],c.root,c.type,0);marks.push(r.ok?'ok':'bad');if(!r.ok)bad.push(`${labs[ci]} = ${chName(c)}`);});
      return {ok:!bad.length,msg:bad.length?'Fehler bei: '+bad.join('; ')+'.':`${nm}: ${seq.map(chName).join(' – ')}.`,marks};},
    solution:()=>staffBox({cols:seq.map((c,i)=>chordCol(c.notes,labs[i],chName(c),'ok')),colW:92,dLo:-2,dHi:13}),
    play:()=>Snd.cadence(seq)};

/* Memory */
function memory(host,exId,pairs){
  const cards=shuffle(pairs.flatMap((p,i)=>[{k:i,t:p[0]},{k:i,t:p[1]}]));
  let open=[],found=0,moves=0,lock=false;
  host.innerHTML=`<div class="rh"><span class="mv">Züge: 0</span><div class="bar"><i></i></div><span class="mf">0 von ${pairs.length}</span></div><div class="memo"></div><div class="rfb"></div>`;
  const grid=$('.memo',host);
  cards.forEach(c=>{const b=el(`<button type="button" class="mc" aria-label="Karte">${esc(c.t)}</button>`);c.el=b;
    b.onclick=()=>{
      if(lock||b.classList.contains('up')||b.classList.contains('hit')) return;
      b.classList.add('up');open.push(c);
      if(open.length===2){
        moves++;$('.mv',host).textContent='Züge: '+moves;
        const [a,d]=open;
        if(a.k===d.k){a.el.classList.add('hit');d.el.classList.add('hit');found++;open=[];
          $('.mf',host).textContent=found+' von '+pairs.length;$('.bar i',host).style.width=(found/pairs.length*100)+'%';
          if(found===pairs.length){$('.rfb',host).innerHTML=`<div class="fb ok"><strong>Geschafft.</strong> ${moves} Züge. Weniger als ${pairs.length*2} Züge ist sehr gut.</div>`;markEx(exId,1);}
        }else{lock=true;setTimeout(()=>{a.el.classList.remove('up');d.el.classList.remove('up');open=[];lock=false;},900);}
      }
    };grid.appendChild(b);});
}

/* Tabelle ausfüllen */
function fillTable(host,exId,rows,head,check){
  host.innerHTML=`<div class="htgrid"></div><div class="btnrow"><button type="button" class="btn primary" data-c>Prüfen</button><button type="button" class="btn ghost" data-n>Neue Aufgabe</button><span class="small muted" data-s></span></div>`;
  const g=$('.htgrid',host);
  rows.forEach((r,i)=>{
    const id='ft-'+exId+'-'+i;
    g.appendChild(el(`<div class="hrow"><label for="${id}">${r.label}</label>${r.play?pb(r.play,'Anhören'):''}<input class="inp num" id="${id}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="${r.w?'flex:0 0 '+r.w:''}"></div>`));
  });
  $('[data-n]',host).onclick=()=>fillTable(host,exId,cfgFor(),head,check);
  let cfgFor=()=>rows;
  $('[data-c]',host).onclick=()=>{
    let ok=0;
    rows.forEach((r,i)=>{const inp=$('#ft-'+exId+'-'+i,host),good=check(r,inp.value);inp.classList.remove('ok','bad');inp.classList.add(good?'ok':'bad');if(good)ok++;else inp.title='Richtig: '+r.show;});
    $('[data-s]',host).textContent=`${ok} von ${rows.length} richtig. Falsche Felder: Antwort mit der Maus anzeigen oder neu versuchen.`;
    if(ok===rows.length) markEx(exId,1); else if(ok/rows.length>=.6) markEx(exId,ok/rows.length);
  };
  return {setGen:f=>{cfgFor=f;}};
}
